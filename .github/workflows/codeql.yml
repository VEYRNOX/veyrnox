name: CodeQL

# Replaces GitHub's CodeQL "Default setup", which was failing on two languages:
#
#   - language:swift  — hard error ("Detected build command failed"). Autobuild
#     cannot build a Capacitor iOS app: the web assets must be built and synced
#     (npm run build + npx cap sync ios) before xcodebuild has anything to
#     compile. Net effect: the Secure Enclave / hardware-KEK Swift sources
#     (EnclaveKeyService.swift, VeyrnoxEnclavePlugin.swift) have never actually
#     been scanned. This workflow gives Swift a manual build that mirrors
#     .github/workflows/ios-compile-check.yml, which is known to compile clean.
#
#   - language:ruby   — hard error. There is no Ruby in this repository at all
#     (no .rb, Gemfile, Podfile or Fastfile is tracked). It is simply dropped
#     from the language list below rather than scanned.
#
# HONESTY SCOPE: this makes the scans RUN. It does not by itself prove the code
# is free of findings — a green CodeQL run means "analysed, nothing matched the
# queries", not "audited". The independent third-party security audit remains
# outstanding regardless of what this reports.
#
# NOTE FOR WHOEVER MERGES THIS: CodeQL "Default setup" must be DISABLED in the
# repo UI first (Settings → Code security → CodeQL analysis → Default setup →
# Disable), otherwise GitHub refuses to run an advanced workflow alongside it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so scheduled-only queries and new rules still land on main.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    # All five languages here are build-mode: none and finish in ~1-3 min.
    timeout-minutes: 20

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # No build required — analysed directly from source.
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest

          # Compiled — analysed BUILDLESS. autobuild cannot configure this Gradle
          # project: android/app/build.gradle does `apply from: capacitor.build.gradle`,
          # which only exists after `npm run build && npx cap sync android`. Rather than
          # run a full Capacitor+Gradle build twice (once per language) just to extract
          # sources, use build-mode: none — CodeQL extracts Java/Kotlin and C/C++ directly
          # from source. This is what Default setup was doing for these two languages.
          - language: java-kotlin
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build-mode: none
            runner: ubuntu-latest

          # Swift is NOT in this matrix — it needs a macOS runner and a full
          # Capacitor + xcodebuild compile, so it lives in `analyze-swift` below
          # where it can be scheduled independently. See that job for why.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # --------------------------------------------------------------------------
  # Swift runs on EVERY pull request. This is deliberate, and it is a reversal.
  #
  # Swift is the only language needing a macOS runner and a real compile.
  # Measured 2026-07-26: 20-50 min QUEUED for a scarce macOS slot, then ~38 min
  # running — 60-90 min end to end, against ~1-3 min for the five source-only
  # languages. PR #1368 responded by skipping it on PRs that touch no iOS or
  # Swift files (only 3.3% of recent commits do), so the other ~97% would not
  # wait.
  #
  # That made things worse, for a reason the ruleset made unavoidable. The
  # repo's code_scanning rule gates on the CodeQL TOOL and has NO per-language
  # granularity — verified against the live ruleset: the rule's only parameter
  # is a list of {tool, alerts_threshold, security_alerts_threshold}, with no
  # language or category field. A PR that uploads five of six languages leaves
  # the tool's result set incomplete, so the gate is never satisfied and the PR
  # is blocked FOREVER rather than for an hour. That is issue #1375.
  #
  # PR #1377 tried to close the hole by uploading a SARIF for /language:swift
  # on the skip path, marked honestly as `executionSuccessful: false`. GitHub
  # rejects it outright:
  #
  #   Analysis upload status is failed.
  #   Code Scanning could not process the submitted SARIF file:
  #   unsuccessful execution, exit code: 0
  #
  # Code Scanning will not record a non-run as an analysis. The only SARIF it
  # would accept is one claiming `executionSuccessful: true` with no results —
  # i.e. asserting "CodeQL analysed Swift and found nothing" about code nobody
  # scanned. That is precisely the "never mock a security control to look real"
  # prohibition, so it is not an option.
  #
  # With per-language gating impossible and a truthful skip-record impossible,
  # the remaining choices were: always scan, or drop the code_scanning rule and
  # make CodeQL advisory. Always-scan keeps the gate real.
  #
  # THE COST IS REAL AND ACCEPTED: every PR now waits 60-90 min for a macOS
  # runner before it can merge. That is worse for latency than #1368 and better
  # than the status quo, where PRs never became mergeable at all and four were
  # pushed through with --admin on 2026-07-26 — which is how a security gate
  # quietly becomes decorative.
  #
  # If the latency proves unacceptable, the honest lever is to drop the
  # code_scanning rule from the ruleset deliberately and record it as an
  # accepted residual — NOT to reintroduce conditional scanning, which produces
  # unmergeable PRs, nor to fake the SARIF. See #1375 before changing this.
  # --------------------------------------------------------------------------
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    # Generous: full Capacitor + xcodebuild compile, and the macOS queue is slow.
    timeout-minutes: 60

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # xcodebuild has nothing to compile until the web assets exist and
      # Capacitor has synced them into ios/App/App/public. Mirrors the working
      # recipe in ios-compile-check.yml.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build web assets + sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: |
          # SPM project (CapApp-SPM — no Podfile/CocoaPods).
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App 2>&1 | tail -5

      - name: Compile iOS app for CodeQL
        working-directory: ios/App
        run: |
          set -o pipefail
          # Unsigned compile — the runner has no certificates. ONLY_ACTIVE_ARCH=NO
          # so the whole target is compiled and therefore extracted by CodeQL.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -30

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
