name: Android release-tool security

on:
  pull_request:
    paths:
      - android/Gemfile
      - android/Gemfile.lock
      - android/fastlane/Pluginfile
      - tests/ruby/**
      - .github/workflows/android-ruby-security.yml
  push:
    branches: [main]
    paths:
      - android/Gemfile
      - android/Gemfile.lock
      - android/fastlane/Pluginfile
      - tests/ruby/**
      - .github/workflows/android-ruby-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rubyzip-security:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.6'
          working-directory: android
          bundler-cache: true
      - name: Load release tools and reject ZIP path traversal
        working-directory: android
        run: bundle exec ruby ../tests/ruby/rubyzip_regression.rb
