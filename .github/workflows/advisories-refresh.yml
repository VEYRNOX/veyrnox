name: Advisories Refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Codex P1 2026-08-15: this scheduled workflow carries contents: write,
      # pull-requests: write and OPENROUTER_API_KEY. Floating tags let an
      # upstream tag re-target or a maintainer compromise execute attacker code
      # with those scopes on the next scheduled run. Pin every action to a
      # commit SHA (with `# vX` trailing for legibility). SHAs match the ones
      # already used in ci.yml / firebase-test-lab.yml for the same versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Refresh advisories
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/refresh-advisories.mjs

      - name: Open PR on diff
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/advisories-refresh
          commit-message: 'chore(advisories): weekly refresh'
          title: 'chore(advisories): weekly refresh'
          body: |
            Auto-generated by `.github/workflows/advisories-refresh.yml`.
            Source: OpenRouter perplexity/sonar (web-search), 90-day window, CVSS >= 7.0.

            ⚠️ Human review REQUIRED — the model can hallucinate CVE numbers.
            Spot-check each entry against its `source_url` before merging.
            Delete entries that don't check out; commit the trimmed result.
          add-paths: src/data/security-advisories.json
