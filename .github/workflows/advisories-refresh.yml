name: Advisories Refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh advisories
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/refresh-advisories.mjs

      - name: Open PR on diff
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/advisories-refresh
          commit-message: 'chore(advisories): weekly refresh'
          title: 'chore(advisories): weekly refresh'
          body: |
            Auto-generated by `.github/workflows/advisories-refresh.yml`.
            Source: NVD keywordSearch, 90-day window, CVSS >= 7.0.
            Review the diff, merge if entries look sane.
          add-paths: src/data/security-advisories.json
