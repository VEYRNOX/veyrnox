name: Firebase Test Lab (Android + iOS smoke)
# ------------------------------------------------------------------
# Runs the same Robo crawler Google Play Pre-launch report uses,
# on physical devices in Google's data center — BEFORE a production AAB is
# ever uploaded to Play. Rejection-shaped defects (crash on Create
# Wallet, unresponsive UI, KEK fail-closed on untested hardware)
# surface here, not from a human reviewer.
#
# Cost: billed by Firebase for the configured 3-device matrix.
# Auth: workload-identity federation to Firebase, or a service-account
# JSON stored as GCP_SA_KEY. Setup: docs/firebase-test-lab-setup.md.
#
# iOS side: no Robo equivalent exists. This runs XCUITest smoke
# instead. See notes below.
# ------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Device matrix to run'
        type: choice
        required: true
        default: 'android'
        options:
          - android
          - ios
          - both
      timeout:
        description: 'Per-device timeout (e.g. 5m, 10m)'
        type: string
        required: false
        default: '5m'
      publish_staging:
        description: 'After BOTH Firebase suites pass, upload staging packages to TestFlight and Play Internal Testing'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package-lock.json'
      - '.github/testlab/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/firebase-test-lab.yml'

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Manual release gates dispatch ci.yml for this exact ref/SHA, then read its
  # artifacts. Push-triggered smoke runs remain read-only in practice.
  actions: write
  id-token: write

# These are public client identifiers/endpoints already baked into native
# packages by ci.yml. The staging mode adds the visible Staging label and turns
# on the Transak entry point; the Transak partner credentials remain server-side
# on the edge endpoint and are never exposed as VITE_* values.
env:
  VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
  VITE_TIP_BASE_URL: ${{ vars.VITE_TIP_BASE_URL }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_EDGE_BASE: ${{ vars.VITE_EDGE_BASE }}

jobs:
  # --------------------------------------------------------------
  # Android — Robo crawler on 3 real devices. Same infra as Play
  # Pre-launch report. Output: crashes, ANRs, screenshots, video,
  # logcat per device.
  # --------------------------------------------------------------
  android-robo:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platform == 'android'
      || inputs.platform == 'both'
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.ci_run.outputs.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Dispatch exact CI artifacts for this manual gate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STAGING: ${{ inputs.publish_staging }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml \
            --ref "$GITHUB_REF_NAME" \
            -f build_firebase_test=true \
            -f build_staging_release="$PUBLISH_STAGING"

      # This workflow and ci.yml start independently on the same main push. A
      # manual branch run first dispatches ci.yml with build_firebase_test=true.
      # Accept only push/workflow_dispatch CI runs for THIS SHA, then download
      # by run ID. A PR run cannot produce the isolated signed Firebase APK.
      - name: Wait for this commit's successful CI artifact
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EXPECTED_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            RUN_JSON=$(gh run list \
              --workflow ci.yml \
              --commit "$SHA" \
              --limit 20 \
              --json databaseId,status,conclusion,event,createdAt \
              --jq "[.[] | select(.event == \"$EXPECTED_EVENT\")] | sort_by(.createdAt) | reverse | .[0] // {}")
            RUN_ID=$(jq -r '.databaseId // empty' <<<"$RUN_JSON")
            STATUS=$(jq -r '.status // empty' <<<"$RUN_JSON")
            CONCLUSION=$(jq -r '.conclusion // empty' <<<"$RUN_JSON")

            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" != "success" ]]; then
                echo "::error::CI run ${RUN_ID} for ${SHA} concluded ${CONCLUSION}; refusing to test another commit's APK."
                exit 1
              fi
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if (( attempt % 8 == 1 )); then
              echo "Waiting for CI on ${SHA} (status=${STATUS:-not-started})..."
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for a successful CI run for ${SHA}; refusing to fall back to an older APK."
          exit 1

      - name: Download this commit's isolated Firebase APK from ci.yml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: veyrnox-firebase-test-apk
          path: artifacts
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Robo crawl (3 devices, mixed API levels)
        id: robo
        # --num-flaky-test-attempts 0 means no retry: any crash is a crash.
        # Model IDs must match Firebase's current catalog exactly. First run
        # tried raven/a13/husky and hit "'raven' is not a valid model" — some
        # were retired. The three below are long-lived Pixels confirmed on
        # the 2026-08 catalog. To extend coverage later:
        #   gcloud firebase test android models list
        # and add rows here.
        # The Capacitor PinPad is a grid of WebView buttons, not EditText
        # fields. MainActivity sets FLAG_SECURE, so screenshots/OCR are blank by
        # design. The Robo Script therefore targets the WebView accessibility
        # tree (text/contentDescription), enters + explicitly submits the
        # eight-digit PIN twice, then hands control back to the crawler.
        # TIMEOUT and RESULTS_BUCKET come via env: workflow-dispatch input goes
        # through a regex allowlist to block shell metachars (injection guard).
        env:
          RAW_TIMEOUT: ${{ inputs.timeout }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          RESULTS_DIR: robo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Allowlist: digits followed by s/m/h. Reject anything else, fall back to 5m.
          if [[ "${RAW_TIMEOUT:-}" =~ ^[0-9]+[smh]$ ]]; then
            TIMEOUT="$RAW_TIMEOUT"
          else
            TIMEOUT="5m"
          fi
          echo "results_dir=$RESULTS_DIR" >> "$GITHUB_OUTPUT"
          set +e
          gcloud firebase test android run \
            --type robo \
            --app artifacts/app-firebaseTest.apk \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --device model=shiba,version=34,locale=en,orientation=portrait \
            --timeout "$TIMEOUT" \
            --num-flaky-test-attempts 0 \
            --no-resign \
            --robo-script .github/testlab/android-pin-onboarding-robo-script.json \
            --results-bucket "$RESULTS_BUCKET" \
            --results-dir "$RESULTS_DIR" 2>&1 | tee firebase-test-lab.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          MATRIX_ID=$(sed -n 's/.*Test \[\(matrix-[^]]*\)\].*/\1/p' firebase-test-lab.log | tail -1)
          echo "matrix_id=$MATRIX_ID" >> "$GITHUB_OUTPUT"
          exit "$TEST_STATUS"

      # The normal gcloud table collapses device preparation and startup errors
      # into "Test failed to run". Query only the matrix/execution status fields;
      # never print logcat or app artifacts, which may contain wallet state.
      - name: Surface sanitized per-device Firebase diagnostics
        if: always() && steps.robo.outputs.matrix_id != ''
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MATRIX_ID: ${{ steps.robo.outputs.matrix_id }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://testing.googleapis.com/v1/projects/${PROJECT_ID}/testMatrices/${MATRIX_ID}" \
            --output firebase-matrix.json
          jq '{
            state,
            invalidMatrixDetails,
            outcomeSummary,
            testExecutions: [
              .testExecutions[]? | {
                id,
                state,
                environment: .environment.androidDevice,
                testDetails,
                toolResultsStep: .toolExecution.toolResultsStep,
                toolLogs: (.toolExecution.toolLogs // []),
                toolOutputs: (.toolExecution.toolOutputs // []),
                outcome: .toolExecution.outcome,
                infrastructureFailure: (
                  .toolExecution.infrastructureFailure
                  // .infrastructureFailure
                  // null
                )
              }
            ]
          }' firebase-matrix.json

      # Print only relative object names. Content such as logcat, screenshots,
      # and UI dumps is deliberately not emitted because it can contain wallet
      # state. The inventory still shows exactly which per-axis diagnostics are
      # available for a private follow-up inspection.
      - name: Surface sanitized Firebase result inventory
        if: always() && steps.robo.outputs.results_dir != ''
        env:
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          RESULTS_DIR: ${{ steps.robo.outputs.results_dir }}
        run: |
          set -euo pipefail
          if ! gcloud storage ls --recursive "gs://${RESULTS_BUCKET}/${RESULTS_DIR}/**" \
            | sed "s#^gs://${RESULTS_BUCKET}/${RESULTS_DIR}/##" \
            | LC_ALL=C sort; then
            echo "::warning::Firebase result inventory unavailable. The configured GitHub Actions service account lacks read/list access on gs://${RESULTS_BUCKET}/${RESULTS_DIR}. Grant Cloud Storage Storage Object Viewer on the results bucket if private inventory output is required."
          fi

      - name: Post results link to job summary
        if: always()
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          RESULTS_DIR: ${{ steps.robo.outputs.results_dir }}
          MATRIX_ID: ${{ steps.robo.outputs.matrix_id }}
        run: |
          {
            echo "### Firebase Test Lab — Robo crawl"
            echo "Results: https://console.firebase.google.com/project/${PROJECT_ID}/testlab/histories/"
            echo "Matrix: \`${MATRIX_ID:-unavailable}\`"
            echo "Bucket:  gs://${RESULTS_BUCKET}/${RESULTS_DIR}"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------
  # iOS — Firebase Test Lab for iOS does NOT support Robo. Only
  # XCUITest. So this runs a minimal XCUITest smoke bundle that
  # walks the same golden path a Play reviewer would: fresh
  # install → New wallet → set + confirm 8-digit PIN → Created.
  #
  # The XCUITest target exists. Firebase requires both the app and runner to be
  # signed before upload; App Store Connect API authentication lets Xcode
  # automatically resolve the development signing assets on the clean runner.
  # --------------------------------------------------------------
  ios-smoke:
    # The variable is an explicit owner-controlled readiness gate. The job also
    # validates all three signing secrets and codesign-verifies both products.
    if: >-
      vars.IOS_FIREBASE_SIGNING_READY == 'true'
      && (github.event_name != 'workflow_dispatch'
      || inputs.platform == 'ios'
      || inputs.platform == 'both')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # Same npm/node/build/sync chain as ios-compile-check.yml — Capacitor's
      # iOS project only exists as a real xcode-buildable thing after
      # `npm run build && npx cap sync ios` has run. The .xcodeproj on disk
      # is a template; sync populates it with the built web bundle.
      - name: Pin npm to 11
        run: npm install -g npm@11
      - run: npm ci
      - name: Build staging web assets + sync Capacitor iOS
        run: |
          npm run build:staging
          npx cap sync ios
      - name: Install Test Lab iOS Firebase config
        run: |
          set -euo pipefail
          cp .github/firebase/ios/com.veyrnox.app/GoogleService-Info.plist \
            ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' \
            ios/App/App/GoogleService-Info.plist \
            | grep -Fx 'com.veyrnox.app'

      - name: Install App Store Connect signing key
        id: asc_key
        env:
          IOS_ASC_PRIVATE_KEY: ${{ secrets.IOS_ASC_PRIVATE_KEY }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${IOS_ASC_PRIVATE_KEY:?IOS_ASC_PRIVATE_KEY is required}"
          : "${IOS_ASC_KEY_ID:?IOS_ASC_KEY_ID is required}"
          : "${IOS_ASC_ISSUER_ID:?IOS_ASC_ISSUER_ID is required}"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${IOS_ASC_KEY_ID}.p8"
          printf '%s' "$IOS_ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "path=$ASC_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        env:
          ASC_KEY_PATH: ${{ steps.asc_key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          # Resolve for BOTH schemes so the AppUITests build graph gets the
          # same Capacitor module instance the App target uses. Previously we
          # only resolved for -scheme App; xcodebuild then re-resolved on
          # first use of -scheme AppUITests and picked a stale/split
          # capacitor-swift-pm graph, which made SharePlugin.swift compile
          # against a Capacitor without CAPPluginCall.reject.
          rm -f App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme AppUITests \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -5
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -5

      - name: Build and verify signed app + test runner
        working-directory: ios/App
        env:
          ASC_KEY_PATH: ${{ steps.asc_key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # SPM project (CapApp-SPM — no Podfile/CocoaPods, no .xcworkspace).
          # Use -project, not -workspace. Test Lab re-signs only after accepting
          # these already-signed products, so verify both locally first.
          xcodebuild \
            -project App.xcodeproj \
            -scheme AppUITests \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ \
            DEVELOPMENT_TEAM=R54268MWFV \
            CODE_SIGN_STYLE=Automatic \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            build-for-testing 2>&1 | tail -30

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/App.app"
          RUNNER_PATH="$(find "$PWD/build/Build/Products/Debug-iphoneos" -maxdepth 2 -type d -name '*UITests-Runner.app' -print -quit)"
          test -d "$APP_PATH"
          test -n "$RUNNER_PATH"
          test -s "$APP_PATH/GoogleService-Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_PATH"

          DSYM_PATH="$PWD/build/Build/Products/Debug-iphoneos/App.app.dSYM"
          UPLOAD_SYMBOLS="$PWD/build/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          test -d "$DSYM_PATH"
          test -x "$UPLOAD_SYMBOLS"
          "$UPLOAD_SYMBOLS" \
            -gsp "$APP_PATH/GoogleService-Info.plist" \
            -p ios \
            "$DSYM_PATH"

          cd build/Build/Products
          zip -r ios-tests.zip Debug-iphoneos *.xctestrun

      - name: XCUITest smoke on real iPhones
        id: ios_test
        env:
          RAW_TIMEOUT: ${{ inputs.timeout }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${RAW_TIMEOUT:-}" =~ ^[0-9]+[smh]$ ]]; then
            TIMEOUT="$RAW_TIMEOUT"
          else
            TIMEOUT="5m"
          fi
          set +e
          gcloud firebase test ios run \
            --test ios/App/build/Build/Products/ios-tests.zip \
            --device model=iphone13pro,version=16.6,locale=en_US,orientation=portrait \
            --device model=iphone14,version=17.5,locale=en_US,orientation=portrait \
            --timeout "$TIMEOUT" \
            --results-bucket "$RESULTS_BUCKET" \
            --results-dir "ios-smoke-$SHA-${{ github.run_id }}-${{ github.run_attempt }}" 2>&1 \
            | tee firebase-ios-test-lab.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          MATRIX_ID=$(sed -n 's/.*Test \[\(matrix-[^]]*\)\].*/\1/p' firebase-ios-test-lab.log | tail -1)
          echo "matrix_id=$MATRIX_ID" >> "$GITHUB_OUTPUT"
          exit "$TEST_STATUS"

      - name: Surface sanitized iOS per-device diagnostics
        if: always() && steps.ios_test.outputs.matrix_id != ''
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MATRIX_ID: ${{ steps.ios_test.outputs.matrix_id }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://testing.googleapis.com/v1/projects/${PROJECT_ID}/testMatrices/${MATRIX_ID}" \
            --output firebase-ios-matrix.json
          jq '{
            state,
            invalidMatrixDetails,
            outcomeSummary,
            testExecutions: [
              .testExecutions[]? | {
                id,
                state,
                environment: .environment.iosDevice,
                testDetails,
                toolResultsStep: .toolExecution.toolResultsStep,
                toolLogs: (.toolExecution.toolLogs // []),
                toolOutputs: (.toolExecution.toolOutputs // []),
                outcome: .toolExecution.outcome,
                infrastructureFailure: (
                  .toolExecution.infrastructureFailure
                  // .infrastructureFailure
                  // null
                )
              }
            ]
          }' firebase-ios-matrix.json

      - name: Post results link
        if: always()
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          {
            echo "### Firebase Test Lab — iOS smoke"
            echo "Results: https://console.firebase.google.com/project/${PROJECT_ID}/testlab/histories/"
            echo "Matrix: \`${{ steps.ios_test.outputs.matrix_id || 'unavailable' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------
  # Store distribution is deliberately downstream of BOTH device suites. A
  # staging upload can never race ahead of a red Android or iOS matrix.
  # --------------------------------------------------------------
  publish-android-staging:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.platform == 'both'
      && inputs.publish_staging == true
    needs: [android-robo, ios-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download Firebase-gated staging AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: veyrnox-staging-aab
          path: aab-artifact
          run-id: ${{ needs.android-robo.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify staging AAB
        run: test -s aab-artifact/app-release.aab
      - name: Upload Android 1.0.1 staging to Play Internal Testing
        uses: r0adkll/upload-google-play@935ef9c68bfaeb5c8b5c0f9bc8b6a2f7b2fce4d3 # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.veyrnox.app
          releaseFiles: aab-artifact/app-release.aab
          track: internal
          status: completed

  publish-ios-staging:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.platform == 'both'
      && inputs.publish_staging == true
    needs: [android-robo, ios-smoke]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Build staging web assets + sync Capacitor iOS
        run: |
          npm run build:staging
          npx cap sync ios
      - name: Install iOS staging Firebase config
        run: |
          set -euo pipefail
          cp .github/firebase/ios/com.veyrnox.app/GoogleService-Info.plist \
            ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' \
            ios/App/App/GoogleService-Info.plist \
            | grep -Fx 'com.veyrnox.app'
      - name: Install App Store Connect key
        id: asc_upload_key
        env:
          IOS_ASC_PRIVATE_KEY: ${{ secrets.IOS_ASC_PRIVATE_KEY }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${IOS_ASC_PRIVATE_KEY:?IOS_ASC_PRIVATE_KEY is required}"
          : "${IOS_ASC_KEY_ID:?IOS_ASC_KEY_ID is required}"
          : "${IOS_ASC_ISSUER_ID:?IOS_ASC_ISSUER_ID is required}"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          ASC_KEY_PATH="$KEY_DIR/AuthKey_${IOS_ASC_KEY_ID}.p8"
          printf '%s' "$IOS_ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "path=$ASC_KEY_PATH" >> "$GITHUB_OUTPUT"
      - name: Archive, verify, and export iOS 1.0.1 staging
        working-directory: ios/App
        env:
          ASC_KEY_PATH: ${{ steps.asc_upload_key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Veyrnox-Staging.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/Veyrnox-Staging-DerivedData" \
            DEVELOPMENT_TEAM=R54268MWFV \
            CODE_SIGN_STYLE=Automatic \
            VEYRNOX_FIREBASE_OBSERVABILITY=YES \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          codesign --verify --deep --strict --verbose=2 \
            "$RUNNER_TEMP/Veyrnox-Staging.xcarchive/Products/Applications/App.app"
          APP_PATH="$RUNNER_TEMP/Veyrnox-Staging.xcarchive/Products/Applications/App.app"
          DSYM_PATH="$RUNNER_TEMP/Veyrnox-Staging.xcarchive/dSYMs/App.app.dSYM"
          UPLOAD_SYMBOLS="$RUNNER_TEMP/Veyrnox-Staging-DerivedData/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          test -s "$APP_PATH/GoogleService-Info.plist"
          test -d "$DSYM_PATH"
          test -x "$UPLOAD_SYMBOLS"
          "$UPLOAD_SYMBOLS" \
            -gsp "$APP_PATH/GoogleService-Info.plist" \
            -p ios \
            "$DSYM_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Veyrnox-Staging.xcarchive" \
            -exportOptionsPlist ExportOptionsCI.plist \
            -exportPath "$RUNNER_TEMP/Veyrnox-Staging" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -s "$RUNNER_TEMP/Veyrnox-Staging/App.ipa"
      - name: Upload iOS 1.0.1 staging to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/Veyrnox-Staging/App.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
