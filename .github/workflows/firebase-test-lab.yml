name: Firebase Test Lab (Android + iOS smoke)
# ------------------------------------------------------------------
# Runs the same Robo crawler Google Play Pre-launch report uses,
# on physical devices in Google's data center — BEFORE the AAB is
# ever uploaded to Play. Rejection-shaped defects (crash on Create
# Wallet, unresponsive UI, KEK fail-closed on untested hardware)
# surface here, not from a human reviewer.
#
# Cost: ~$2/run on Blaze (5 devices × 5 min).
# Auth: workload-identity federation to Firebase, or a service-account
# JSON stored as GCP_SA_KEY. Setup: docs/firebase-test-lab-setup.md.
#
# iOS side: no Robo equivalent exists. This runs XCUITest smoke
# instead. See notes below.
# ------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Per-device timeout (e.g. 5m, 10m)'
        default: '5m'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package-lock.json'

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # --------------------------------------------------------------
  # Android — Robo crawler on 5 real devices. Same infra as Play
  # Pre-launch report. Output: crashes, ANRs, screenshots, video,
  # logcat per device.
  # --------------------------------------------------------------
  android-robo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download release AAB from ci.yml
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: ci.yml
          workflow_conclusion: success
          name: veyrnox-release-aab
          path: artifacts
          branch: main

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Robo crawl (3 devices, mixed API levels)
        # --num-flaky-test-attempts 0 means no retry: any crash is a crash.
        # Model IDs must match Firebase's current catalog exactly. First run
        # tried raven/a13/husky and hit "'raven' is not a valid model" — some
        # were retired. The three below are long-lived Pixels confirmed on
        # the 2026-08 catalog. To extend coverage later:
        #   gcloud firebase test android models list
        # and add rows here.
        # --robo-directives seeds the PIN screen so the crawler can pass the
        # first gate (otherwise it stalls at PIN).
        # TIMEOUT and RESULTS_BUCKET come via env: workflow-dispatch input goes
        # through a regex allowlist to block shell metachars (injection guard).
        env:
          RAW_TIMEOUT: ${{ inputs.timeout }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Allowlist: digits followed by s/m/h. Reject anything else, fall back to 5m.
          if [[ "${RAW_TIMEOUT:-}" =~ ^[0-9]+[smh]$ ]]; then
            TIMEOUT="$RAW_TIMEOUT"
          else
            TIMEOUT="5m"
          fi
          gcloud firebase test android run \
            --type robo \
            --app artifacts/app-release.aab \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --device model=shiba,version=34,locale=en,orientation=portrait \
            --timeout "$TIMEOUT" \
            --num-flaky-test-attempts 0 \
            --robo-directives text:pin_input=246810,text:pin_confirm=246810 \
            --results-bucket "$RESULTS_BUCKET" \
            --results-dir "robo-$SHA"

      - name: Post results link to job summary
        if: always()
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Firebase Test Lab — Robo crawl"
            echo "Results: https://console.firebase.google.com/project/${PROJECT_ID}/testlab/histories/"
            echo "Bucket:  gs://${RESULTS_BUCKET}/robo-${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------
  # iOS — Firebase Test Lab for iOS does NOT support Robo. Only
  # XCUITest. So this runs a minimal XCUITest smoke bundle that
  # walks the same golden path a Play reviewer would: fresh
  # install → PIN → Create Wallet → seed reveal.
  #
  # First run: needs macOS runner (Apple-only Xcode). Blocked
  # until we add the XCUITest target — see
  # ios/App/AppUITests/README.md for the ~30-line smoke suite.
  # --------------------------------------------------------------
  ios-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # Same npm/node/build/sync chain as ios-compile-check.yml — Capacitor's
      # iOS project only exists as a real xcode-buildable thing after
      # `npm run build && npx cap sync ios` has run. The .xcodeproj on disk
      # is a template; sync populates it with the built web bundle.
      - name: Pin npm to 11
        run: npm install -g npm@11
      - run: npm ci
      - name: Build web assets + sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: |
          # Resolve for BOTH schemes so the AppUITests build graph gets the
          # same Capacitor module instance the App target uses. Previously we
          # only resolved for -scheme App; xcodebuild then re-resolved on
          # first use of -scheme AppUITests and picked a stale/split
          # capacitor-swift-pm graph, which made SharePlugin.swift compile
          # against a Capacitor without CAPPluginCall.reject.
          rm -f App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme AppUITests 2>&1 | tail -5
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App 2>&1 | tail -5

      - name: Build IPA + test bundle
        working-directory: ios/App
        run: |
          set -o pipefail
          # SPM project (CapApp-SPM — no Podfile/CocoaPods, no .xcworkspace).
          # Use -project, not -workspace.
          # CODE_SIGN_IDENTITY="" — unsigned build. Test Lab NORMALLY requires
          # a signed IPA for real-device runs; this pass will likely surface a
          # signing gap as the next honest error. That's the next PR.
          xcodebuild \
            -project App.xcodeproj \
            -scheme AppUITests \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tail -30
          # Zip products for Test Lab:
          cd build/Build/Products
          zip -r ios-tests.zip Debug-iphoneos *.xctestrun

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: XCUITest smoke on real iPhones
        env:
          RAW_TIMEOUT: ${{ inputs.timeout }}
          RESULTS_BUCKET: ${{ secrets.GCS_RESULTS_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${RAW_TIMEOUT:-}" =~ ^[0-9]+[smh]$ ]]; then
            TIMEOUT="$RAW_TIMEOUT"
          else
            TIMEOUT="5m"
          fi
          gcloud firebase test ios run \
            --test ios/App/build/Build/Products/ios-tests.zip \
            --device model=iphone13pro,version=16.6,locale=en_US,orientation=portrait \
            --device model=iphone14,version=17.5,locale=en_US,orientation=portrait \
            --timeout "$TIMEOUT" \
            --results-bucket "$RESULTS_BUCKET" \
            --results-dir "ios-smoke-$SHA"

      - name: Post results link
        if: always()
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          {
            echo "### Firebase Test Lab — iOS smoke"
            echo "Results: https://console.firebase.google.com/project/${PROJECT_ID}/testlab/histories/"
          } >> "$GITHUB_STEP_SUMMARY"
