name: Android E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      # The lockfile is authored with npm 11; Node 22 ships npm 10, which rejects
      # it (optional native dep resolution). Pin npm 11 to match the toolchain --
      # same step ci.yml, deploy-preview.yml and copilot-setup-steps.yml already run.
      - name: Pin npm to 11
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci

      # Fail closed: the previous `|| true` masked every lint/typecheck failure so
      # the job was green regardless of the real result (H-5, 2026-07-28 audit).
      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build test suite
        run: |
          echo "Test harness present:"
          ls -la tests/android/specs/
          echo ""
          echo "Test configuration ready:"
          ls -la tests/android/wdio.conf.js

  # The former `test-status` job asserted "Vault tests 8/8 passing" and a dozen
  # other suites had passed on every run -- but this workflow only lints, type-
  # checks, and lists spec files. No Appium tests execute in CI (they need a real
  # device). Reporting them as green here was CI honesty theatre (H-5). Removed
  # rather than rewritten: the lint-and-build job's own status already reports
  # what actually ran. Local device-run guidance lives in tests/android/README.md.
