name: Canary Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy to the canary lane"
        required: false
        default: "main"
  push:
    branches: [main]

concurrency:
  group: canary-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
  VITE_TIP_BASE_URL: ${{ vars.VITE_TIP_BASE_URL }}

jobs:
  # R8 audit LOW: restrict workflow_dispatch `ref` input to reviewed refs so a
  # workflow_dispatch caller cannot ship an arbitrary SHA (e.g. a fork PR they
  # merged locally, then referenced) to canary with CLOUDFLARE_API_TOKEN in
  # scope. Only main or a release/* branch is allowed.
  validate-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-allowlisted ref
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          case "$REF" in
            main|release/*) echo "ref '$REF' allowed" ;;
            *) echo "::error::ref '$REF' not on canary allowlist (main | release/*)"; exit 1 ;;
          esac

  deploy-canary:
    needs: [validate-ref]
    # `needs` on a job that only runs on workflow_dispatch would skip this job
    # on push:[main]. `always()` + explicit success/skipped gate keeps both
    # entry points working while still blocking on a failed validate-ref.
    if: always() && (needs.validate-ref.result == 'success' || needs.validate-ref.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Build canary artifact
        env:
          VITE_BUY_ENABLED: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vite build --mode canary

      - name: Install Wrangler
        run: npm install -g wrangler@4.121.0

      - name: Deploy canary to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ''
          command: pages deploy dist --project-name=veyrnox-prod --branch=canary

      - name: Check edge endpoints
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/check-edge-endpoints.mjs "$DEPLOY_URL"

  canary-smoke:
    needs: deploy-canary
    # GitHub Actions implicitly ANDs any custom `if:` (one that doesn't itself
    # start with always()/success()/failure()/cancelled()) with success(), and
    # success() is false here on every push trigger because validate-ref (an
    # ancestor of deploy-canary, skipped on push since it only runs on
    # workflow_dispatch) taints the WHOLE downstream chain by default - even
    # though deploy-canary explicitly overrode that taint for itself via its own
    # `always() && (...)` below. That taint is not cleared for canary-smoke just
    # because deploy-canary ran anyway, so canary-smoke was skipped on every
    # push for at least 11 days (#2788), including in a first fix attempt here
    # that only removed the custom if: - which reverts to the bare default
    # success() and skips for the exact same reason. Mirror deploy-canary's own
    # pattern instead: always() to escape the ancestor taint, then an explicit
    # check of deploy-canary's own result (verified 2026-09-30 with a temporary
    # debug step showing deployment_url was genuinely non-empty and
    # deploy-canary.result was `success`, yet canary-smoke was still skipped
    # under both the original if: and the no-if: attempt - only this pattern
    # actually ran the job under push).
    if: always() && needs.deploy-canary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify a deployment URL was produced
        env:
          URL: ${{ needs.deploy-canary.outputs.deployment_url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::deploy-canary succeeded but produced no deployment_url output"
            exit 1
          fi
          echo "Smoke-testing $URL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for canary to be reachable
        env:
          URL: ${{ needs.deploy-canary.outputs.deployment_url }}
        run: |
          echo "Waiting for $URL to respond..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Canary is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canary at $URL did not become reachable within 5 minutes"
          exit 1

      - name: Smoke-test the deployed canary
        run: npx playwright test e2e/canary-smoke.spec.js --project=chromium
        env:
          BASE_URL: ${{ needs.deploy-canary.outputs.deployment_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-e2e-report
          path: playwright-report/
          retention-days: 14

  canary-gate:
    needs: [deploy-canary, canary-smoke]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate canary result
        run: |
          DEPLOY_RESULT="${{ needs.deploy-canary.result }}"
          SMOKE_RESULT="${{ needs.canary-smoke.result }}"

          echo "deploy-canary: $DEPLOY_RESULT"
          echo "canary-smoke: $SMOKE_RESULT"

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Canary deploy failed ($DEPLOY_RESULT)"
            exit 1
          fi

          if [ "$SMOKE_RESULT" != "success" ]; then
            echo "::error::Canary smoke failed ($SMOKE_RESULT)"
            exit 1
          fi

          echo "Canary deployed and smoke checks passed"
