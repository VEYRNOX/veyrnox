name: Deploy Preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}

jobs:
  # Decides whether this change can skip the staging deploy + e2e.
  #
  # This is an ALLOWLIST, deliberately. Every changed file must match a pattern
  # that provably cannot alter shipped behaviour, or we run the full pipeline.
  # A denylist would fail open: the first file type nobody thought of would
  # silently skip staging e2e, which is exactly the check this gate exists to
  # enforce.
  #
  # NOT exempt, on purpose: package.json and package-lock.json (dependencies,
  # `overrides`, and `scripts` all change what ships), everything under src/,
  # scripts/, android/, ios/, and .github/ workflows themselves. A comment-only
  # edit to package.json is indistinguishable here from a dependency bump, so
  # package.json always runs the full pipeline.
  #
  # Markdown is exempt because nothing imports it: there is no markdown plugin
  # in vite.config.js and no `.md` import anywhere in src/, verified 2026-07-27.
  # If that ever changes, remove the `\.md$` pattern below — docs would then be
  # part of the bundle.
  #
  # Every failure path sets docs_only=false (run everything). Never let an
  # unreadable diff produce an exemption — I4, fail closed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "$1"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Only a pull_request carries a base/head pair we can trust. On the
          # push:[main] and workflow_dispatch triggers there is no payload, so
          # the exemption never applies there and main always gets full staging.
          [ "$EVENT_NAME" = "pull_request" ] || run_everything "event is $EVENT_NAME, not pull_request — full pipeline"
          [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || run_everything "::warning::missing base/head sha — full pipeline"

          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA") || run_everything "::warning::could not compute diff — full pipeline"
          [ -n "$FILES" ] || run_everything "::warning::empty diff — full pipeline"

          echo "changed files:"
          echo "$FILES" | sed 's/^/  /'

          ALLOW='^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE|\.md$|^LICENSE$'
          NON_DOCS=$(echo "$FILES" | grep -vE "$ALLOW" || true)

          if [ -n "$NON_DOCS" ]; then
            echo "non-docs files present — full pipeline:"
            echo "$NON_DOCS" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change — staging deploy/e2e will be skipped"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted token and CANNOT read Actions
    # secrets — GitHub withholds them from dependabot-triggered runs by design.
    # So `secrets.CLOUDFLARE_API_TOKEN` arrives empty and wrangler exits 1 with
    # "In a non-interactive environment, it's necessary to set a
    # CLOUDFLARE_API_TOKEN". That made `deploy` a guaranteed red check on every
    # dependency PR — noise that trains reviewers to ignore a failing pipeline,
    # which is how the @hello-pangea/dnd bump (#1363) reached review with a red
    # X that everyone correctly-but-dangerously waved through.
    #
    # Skipping is also the safer half of the trade: the alternative fix is to
    # add the token to Dependabot secrets, which would hand a live deploy
    # credential to a workflow whose whole job is running a third party's new
    # code. We deliberately do not want a preview deployment badly enough to
    # take that.
    #
    # Fork PRs fail identically and for the same root cause: GitHub does not
    # expose secrets to workflows running from a fork either. The `e2e` job
    # below already documented this ("fork PRs get no Cloudflare secrets") but
    # nothing acted on it, so `deploy` still ran and still went red.
    #
    # `e2e` needs this job, so it skips with us — correct, since there is no
    # preview URL to test against.
    #
    # NOTE for future editors: the fork test must be `fork != true`, NOT the
    # common `head.repo.full_name == github.repository`. On the `push: [main]`
    # trigger there is no pull_request payload, so that comparison is false and
    # would silently stop deploying main. `fork != true` is null-safe: absent
    # payload -> null -> null != true -> the job runs.
    #
    # The docs_only test is `!= 'true'` rather than `== 'false'` for the same
    # null-safety reason as the fork test above: if the `changes` job ever fails
    # to produce an output, the value is empty, and empty != 'true' keeps the
    # deploy running. An exemption must be affirmatively earned.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork != true
      && needs.changes.outputs.docs_only != 'true'
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      environment: ${{ steps.set-env.outputs.environment }}
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Set environment label
        id: set-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # VITE_MOONPAY_API_KEY is a repository variable (not a secret).
        # Injected only on non-main (staging) builds; omitted on main so the
        # production bundle carries no API key at build time.
        env:
          VITE_MOONPAY_API_KEY: ${{ github.ref != 'refs/heads/main' && vars.VITE_MOONPAY_API_KEY || '' }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run build
          else
            npm run build:staging
          fi

      - name: Install Wrangler
        run: npm install -g wrangler

      # Branch names reach us from PR heads and can contain shell metacharacters,
      # so they must never be interpolated straight into a command string.
      # Sanitise to the Cloudflare-safe charset here, then pass the result via
      # env so the deploy step interpolates a value we control.
      - name: Compute deploy branch slug
        id: slug
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG="$(printf '%s' "$RAW_BRANCH" | tr -c 'a-zA-Z0-9-' '-' | cut -c1-28)"
          SLUG="${SLUG%-}"
          echo "slug=${SLUG:-preview}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ''
          command: pages deploy dist --project-name=veyrnox-staging --branch=${{ steps.slug.outputs.slug }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.sha.substring(0, 7);

            // Find and update existing bot comment instead of spamming new ones.
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const marker = '<!-- cloudflare-pages-preview -->';
            const existing = comments.data.find(c => c.body.includes(marker));

            const body = [
              marker,
              `**Preview deployed** (${sha})`,
              '',
              `${url}`,
              '',
              'E2E tests will run against this preview automatically.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Set deployment status
        if: always()
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"

  # E2E runs HERE, in the same PR-triggered workflow, rather than in a separate
  # `workflow_run` workflow. A workflow_run job executes in the BASE repo's
  # privileged context (write-scoped token, secrets) while checking out the PR
  # head — so `npm install` alone would run an attacker's postinstall script
  # with those privileges. Running in-workflow keeps untrusted code in the
  # untrusted context, and lets us take the deployment URL straight from the
  # deploy job instead of reconstructing it from the branch name.
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the repo and talk to the
    # preview URL. It must not inherit the workflow-level pull-requests/
    # deployments write scopes.
    permissions:
      contents: read
    # Only when a real preview URL exists (fork PRs get no Cloudflare secrets,
    # so deploy produces nothing to test against).
    if: ${{ needs.deploy.outputs.deployment_url != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for preview to be reachable
        env:
          URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          echo "Waiting for $URL to respond..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Preview is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview at $URL did not become reachable within 5 minutes"
          exit 1

      # ONLY the smoke spec runs against a deployed build. Seven specs
      # (webauthn-prf-kek, presign-risk-verdict, revenuecat-entitlement-
      # failclosed, i3-deniability-egress, passkey-clone-replay,
      # rasp-automation-detection, send-broadcast.harness-b) do
      # `page.evaluate(() => import('/src/...'))`, which only resolves while
      # Vite is serving source in dev. Against a built, hashed deployment there
      # is no /src/**, so they 404 — 26 failed that way, none of them because
      # the deployment was actually broken. The full suite's harness is the
      # local dev server, where `web-e2e-tests` already runs it.
      #
      # BASE_URL is the variable the specs actually read (see e2e/*.spec.js).
      # It was previously STAGING_URL, which no spec consulted — so every test
      # silently dialled localhost:5173 with no server running.
      - name: Smoke-test the deployed preview
        run: npx playwright test e2e/staging-smoke.spec.js --project=staging
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-e2e-report
          path: playwright-report/
          retention-days: 14

  # MUST keep `if: always()` and MUST NOT gain a path filter of its own. This is
  # a required status check: a required check that never runs is not "skipped",
  # it is missing, and GitHub blocks the merge forever waiting for it. The
  # skipping happens in `deploy`/`e2e`; this job always reports.
  staging-gate:
    needs: [changes, deploy, e2e]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate staging result
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          E2E_RESULT="${{ needs.e2e.result }}"
          DOCS_ONLY="${{ needs.changes.outputs.docs_only }}"

          echo "deploy:    $DEPLOY_RESULT"
          echo "e2e:       $E2E_RESULT"
          echo "docs_only: $DOCS_ONLY"

          # Checked before the blanket skip below so the logs name the reason.
          # Both conditions are required: a docs-only verdict alone must not
          # excuse a deploy that ran and failed.
          if [ "$DOCS_ONLY" = "true" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "Docs-only change — staging deploy/e2e intentionally skipped, gate passes"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "Deploy skipped (dependabot/fork) — staging gate passes"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Deploy failed ($DEPLOY_RESULT) — staging gate blocked"
            exit 1
          fi

          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Staging e2e $E2E_RESULT — staging gate blocked"
            exit 1
          fi

          echo "Staging deployed and e2e passed — gate open"
