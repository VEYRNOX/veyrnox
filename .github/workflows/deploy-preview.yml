name: Deploy Preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Codex P1 2026-08-15: workflow-level pull-requests: write + deployments: write
# were inherited by the `deploy` job that runs untrusted PR code (npm ci + build,
# with any PR-authored postinstall/build script). Drop to read-only at the
# workflow level; the only job that needs write is `preview-comment`, which
# runs AFTER deploy, uses no PR code, and grants itself the narrow scope.
permissions:
  contents: read

env:
  VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
  VITE_TIP_BASE_URL: ${{ vars.VITE_TIP_BASE_URL }}

jobs:
  # Decides whether this change can skip the staging deploy + e2e.
  #
  # This is an ALLOWLIST, deliberately. Every changed file must match a pattern
  # that provably cannot alter shipped behaviour, or we run the full pipeline.
  # A denylist would fail open: the first file type nobody thought of would
  # silently skip staging e2e, which is exactly the check this gate exists to
  # enforce.
  #
  # NOT exempt, on purpose: package.json and package-lock.json (dependencies,
  # `overrides`, and `scripts` all change what ships), everything under src/,
  # scripts/, android/, ios/, and .github/ workflows themselves. A comment-only
  # edit to package.json is indistinguishable here from a dependency bump, so
  # package.json always runs the full pipeline.
  #
  # Markdown is exempt because nothing imports it: there is no markdown plugin
  # in vite.config.js and no `.md` import anywhere in src/, verified 2026-07-27.
  # If that ever changes, remove the `\.md$` pattern below — docs would then be
  # part of the bundle.
  #
  # Every failure path sets docs_only=false (run everything). Never let an
  # unreadable diff produce an exemption — I4, fail closed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "$1"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Only a pull_request carries a base/head pair we can trust. On the
          # push:[main] and workflow_dispatch triggers there is no payload, so
          # the exemption never applies there and main always gets full staging.
          [ "$EVENT_NAME" = "pull_request" ] || run_everything "event is $EVENT_NAME, not pull_request — full pipeline"
          [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || run_everything "::warning::missing base/head sha — full pipeline"

          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA") || run_everything "::warning::could not compute diff — full pipeline"
          [ -n "$FILES" ] || run_everything "::warning::empty diff — full pipeline"

          echo "changed files:"
          echo "$FILES" | sed 's/^/  /'

          ALLOW='^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE|\.md$|^LICENSE$'
          NON_DOCS=$(echo "$FILES" | grep -vE "$ALLOW" || true)

          if [ -n "$NON_DOCS" ]; then
            echo "non-docs files present — full pipeline:"
            echo "$NON_DOCS" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change — staging deploy/e2e will be skipped"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # R8 audit HIGH: build runs PR-controlled code (npm ci + npm run build) and
  # must NEVER carry the Cloudflare API token. Split from `deploy`: this job
  # produces `dist/` + `functions/` + `public/_headers`/_redirects and uploads
  # them as an artifact; the sibling `deploy` job (no checkout, no PR code)
  # downloads that artifact and publishes it. A postinstall/build script in a
  # PR therefore cannot exfil the token — it never enters this process.
  build:
    needs: changes
    runs-on: ubuntu-latest
    # Skip for the same reasons the previous combined job did — dependabot and
    # fork PRs have no route to a preview deploy, so their build is wasted work.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork != true
      && needs.changes.outputs.docs_only != 'true'
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Build
        env:
          # See file-level comment on VITE_BUY_ENABLED / VITE_TRANSAK_API_KEY /
          # VITE_SUPABASE_* — build-time env only, never the Cloudflare token.
          VITE_BUY_ENABLED: 'true'
          VITE_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/main' && vars.VITE_SUPABASE_ANON_KEY || '' }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run build
          else
            npm run build:staging
          fi

      # Branch names reach us from PR heads and can contain shell metacharacters,
      # so they must never be interpolated straight into a command string.
      - name: Compute deploy branch slug
        id: slug
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG="$(printf '%s' "$RAW_BRANCH" | tr -c 'a-zA-Z0-9-' '-' | cut -c1-28)"
          SLUG="${SLUG%-}"
          echo "slug=${SLUG:-preview}" >> "$GITHUB_OUTPUT"

      # dist/ carries the built client bundle; functions/ and the top-level
      # public/_headers/_redirects are picked up by `wrangler pages deploy` at
      # publish time. Ship all three so the deploy job needs nothing from the
      # PR tree.
      - name: Package deploy bundle
        run: |
          mkdir -p _bundle
          cp -R dist _bundle/
          cp -R functions _bundle/
          if [ -f public/_headers ]; then cp public/_headers _bundle/dist/_headers; fi
          if [ -f public/_redirects ]; then cp public/_redirects _bundle/dist/_redirects; fi
          # Include the edge-probe script (used from the post-deploy job) —
          # trusted only because it will be re-checked-out from main below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-bundle
          path: _bundle
          retention-days: 3

  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    # NOTE for future editors: the fork test must be `fork != true`, NOT the
    # common `head.repo.full_name == github.repository`. On the `push: [main]`
    # trigger there is no pull_request payload, so that comparison is false and
    # would silently stop deploying main. `fork != true` is null-safe.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork != true
      && needs.changes.outputs.docs_only != 'true'
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      environment: ${{ steps.set-env.outputs.environment }}
      slug: ${{ needs.build.outputs.slug }}
    steps:
      # This job intentionally does NOT check out the repository — the whole
      # point of the build/deploy split is that no PR-controlled file is on
      # disk while the Cloudflare token is in the environment.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-bundle
          path: _bundle

      - name: Set environment label
        id: set-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      # PINNED — see prior comment on wrangler 4.122.0 regression.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.121.0'
          workingDirectory: _bundle
          command: pages deploy dist --project-name=veyrnox-prod --branch=${{ needs.build.outputs.slug }}

      - name: Set deployment status
        if: always()
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"

  # /api/data/* endpoint probes moved here so the deploy job carries no PR code
  # alongside the Cloudflare token. This checks out MAIN (not the PR head) so
  # only reviewed code runs the probe — the deploy is already live either way.
  edge-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ needs.deploy.outputs.deployment_url != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - env:
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: node scripts/check-edge-endpoints.mjs "$DEPLOY_URL"

  # Codex P1 2026-08-15: post the preview URL comment from a SEPARATE job that
  # does not check out or run any PR code. Only this job gets pull-requests:
  # write, so a malicious postinstall/build script in a PR cannot reach the
  # write-scoped token. Reads the deployment URL from the `deploy` job's output.
  preview-comment:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.deploy.outputs.deployment_url != ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.sha.substring(0, 7);

            // Find and update existing bot comment instead of spamming new ones.
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const marker = '<!-- cloudflare-pages-preview -->';
            const existing = comments.data.find(c => c.body.includes(marker));

            const body = [
              marker,
              `**Preview deployed** (${sha})`,
              '',
              `${url}`,
              '',
              'E2E tests will run against this preview automatically.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # Passive DAST against the deployed preview. Baseline mode spiders the site
  # and reports passive findings only — no active attacks — so it is safe to run
  # on every preview build. The rules file promotes only the security headers
  # this host already claims to emit (X-Frame-Options, X-Content-Type-Options,
  # CSP) to FAIL; everything else stays WARN for now so the gate is narrow and
  # intentional rather than "any passive finding blocks the PR".
  zap-baseline:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.deploy.outputs.deployment_url != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Wait for preview to be reachable
        env:
          URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          echo "Waiting for $URL to respond before ZAP scan..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Preview is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview at $URL did not become reachable within 5 minutes"
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.deployment_url }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

  # E2E runs HERE, in the same PR-triggered workflow, rather than in a separate
  # `workflow_run` workflow. A workflow_run job executes in the BASE repo's
  # privileged context (write-scoped token, secrets) while checking out the PR
  # head — so `npm install` alone would run an attacker's postinstall script
  # with those privileges. Running in-workflow keeps untrusted code in the
  # untrusted context, and lets us take the deployment URL straight from the
  # deploy job instead of reconstructing it from the branch name.
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the repo and talk to the
    # preview URL. It must not inherit the workflow-level pull-requests/
    # deployments write scopes.
    permissions:
      contents: read
    # Only when a real preview URL exists (fork PRs get no Cloudflare secrets,
    # so deploy produces nothing to test against).
    if: ${{ needs.deploy.outputs.deployment_url != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for preview to be reachable
        env:
          URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          echo "Waiting for $URL to respond..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Preview is up"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview at $URL did not become reachable within 5 minutes"
          exit 1

      # ONLY the smoke spec runs against a deployed build. Seven specs
      # (webauthn-prf-kek, presign-risk-verdict, revenuecat-entitlement-
      # failclosed, i3-deniability-egress, passkey-clone-replay,
      # rasp-automation-detection, send-broadcast.harness-b) do
      # `page.evaluate(() => import('/src/...'))`, which only resolves while
      # Vite is serving source in dev. Against a built, hashed deployment there
      # is no /src/**, so they 404 — 26 failed that way, none of them because
      # the deployment was actually broken. The full suite's harness is the
      # local dev server; this preview lane intentionally limits itself to the
      # deployed-artifact smoke checks below.
      #
      # BASE_URL is the variable the specs actually read (see e2e/*.spec.js).
      # It was previously STAGING_URL, which no spec consulted — so every test
      # silently dialled localhost:5173 with no server running.
      - name: Smoke-test the deployed preview
        run: npx playwright test e2e/staging-smoke.spec.js --project=staging
        env:
          BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
          IS_PRODUCTION_BUILD: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-e2e-report
          path: playwright-report/
          retention-days: 14

  # MUST keep `if: always()` and MUST NOT gain a path filter of its own. This is
  # a required status check: a required check that never runs is not "skipped",
  # it is missing, and GitHub blocks the merge forever waiting for it. The
  # skipping happens in `deploy`/`e2e`; this job always reports.
  staging-gate:
    needs: [changes, deploy, edge-check, zap-baseline, e2e]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate staging result
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          EDGE_RESULT="${{ needs.edge-check.result }}"
          ZAP_RESULT="${{ needs.zap-baseline.result }}"
          E2E_RESULT="${{ needs.e2e.result }}"
          DOCS_ONLY="${{ needs.changes.outputs.docs_only }}"

          echo "deploy:    $DEPLOY_RESULT"
          echo "edge:      $EDGE_RESULT"
          echo "zap:       $ZAP_RESULT"
          echo "e2e:       $E2E_RESULT"
          echo "docs_only: $DOCS_ONLY"

          # Checked before the blanket skip below so the logs name the reason.
          # Both conditions are required: a docs-only verdict alone must not
          # excuse a deploy that ran and failed.
          if [ "$DOCS_ONLY" = "true" ] && [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "Docs-only change — staging deploy/e2e intentionally skipped, gate passes"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "Deploy skipped (dependabot/fork) — staging gate passes"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Deploy failed ($DEPLOY_RESULT) — staging gate blocked"
            exit 1
          fi

          if [ "$EDGE_RESULT" != "success" ]; then
            echo "::error::Edge-endpoint probe $EDGE_RESULT — staging gate blocked"
            exit 1
          fi

          if [ "$ZAP_RESULT" != "success" ]; then
            echo "::error::ZAP baseline $ZAP_RESULT — staging gate blocked"
            exit 1
          fi

          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Staging e2e $E2E_RESULT — staging gate blocked"
            exit 1
          fi

          echo "Staging deployed, ZAP passed, and e2e passed — gate open"
