name: perf-web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package-lock.json'
      - 'perf/**'
      - '.github/workflows/perf-web.yml'
  schedule:
    - cron: '15 3 * * 0'   # Sundays 03:15 UTC

concurrency:
  group: perf-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-perf:
    name: Lighthouse-CI sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # LHCI hits ?demo=1 URLs — no Supabase writes escape (I3). Blank
      # the analytics env as belt-and-braces.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match ci.yml — Node 22 + npm 11. The lockfile is authored with
          # npm 11; npm 10 (Node 20 default, Node 22 default) rejects it.
          node-version: 22
          cache: 'npm'

      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install deps
        run: npm ci

      - name: Install perf-only deps
        # LHCI + serve are perf-rig-only; don't bloat the app's package.json.
        run: npm install --no-save --no-package-lock --legacy-peer-deps @lhci/cli@0.14.x serve@14

      - name: Build
        run: npm run build

      - name: Start preview server
        # `serve -s dist -l 4173` handles SPA fallback so /plans etc resolve.
        run: |
          mkdir -p perf/results
          nohup npx serve -s dist -l 4173 > perf/results/serve.log 2>&1 &
          echo $! > perf/results/serve.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173 > /dev/null; then
              echo "preview up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview did not come up in 30s"
          cat perf/results/serve.log || true
          exit 1

      - name: Lighthouse-CI
        # tee the output so the job summary can show the MEASURED values, not just
        # a pass/fail. `pipefail` keeps the assertion exit code as the step's exit
        # code — piping through tee would otherwise mask a failed budget.
        run: |
          set -o pipefail
          mkdir -p perf/results
          npx lhci autorun --config=perf/lighthouserc.json 2>&1 | tee perf/results/lhci.log

      - name: Stop preview server
        if: always()
        run: |
          if [ -f perf/results/serve.pid ]; then
            kill "$(cat perf/results/serve.pid)" 2>/dev/null || true
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-perf-${{ github.run_id }}
          path: |
            perf/results/
            .lighthouseci/
          # `.lighthouseci/` is a DOT-directory, and upload-artifact@v4 excludes
          # hidden paths by default — so every artifact this job has ever produced
          # contained only serve.log, never a single Lighthouse report, while the
          # summary claimed otherwise. Without this flag the budget failures are
          # undiagnosable after the fact.
          include-hidden-files: true
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Lighthouse-CI sweep"
            echo ""
            if [ -f perf/results/lhci.log ]; then
              # lhci colours its output; strip ANSI or the summary renders as escape soup.
              sed 's/\x1b\[[0-9;]*m//g' perf/results/lhci.log > perf/results/lhci-plain.log
              if grep -q 'Assertion failed' perf/results/lhci-plain.log; then
                echo "**Budget assertions FAILED.** Measured values are below — thresholds live in \`perf/lighthouserc.json\`."
              else
                echo "All budget assertions passed."
              fi
              echo ""
              echo '```'
              sed -n '/Checking assertions/,$p' perf/results/lhci-plain.log
              echo '```'
              echo ""
              echo "### Hosted reports"
              # Capture first: `grep | sed` reports SED's status, so a `|| fallback`
              # on the pipeline would never fire and the section would render empty.
              report_urls="$(grep -oE 'https://storage\.googleapis\.com/[^ ]+\.report\.html' perf/results/lhci-plain.log || true)"
              if [ -n "$report_urls" ]; then
                echo "$report_urls" | sed 's/^/- /'
              else
                echo "_none emitted_"
              fi
            else
              echo "_No lhci log — the run failed before Lighthouse started._"
            fi
            echo ""
            echo "Raw \`.lighthouseci/\` JSON and \`lhci.log\` are in artifact \`web-perf-${{ github.run_id }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
