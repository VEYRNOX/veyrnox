# Deploys Supabase Edge Functions from main so what runs in prod is what is in
# git. Audit 2026-09-21 H4: first-referral-bonus and tip-screen were found
# running versions that did not match any commit on main — every deploy had
# been a laptop `supabase functions deploy`, with no record of which tree it
# came from. This is now the only sanctioned path to prod for these functions.
#
# Requires:
#   - secret SUPABASE_ACCESS_TOKEN (Production environment) — a personal
#     access token from supabase.com/dashboard/account/tokens
#   - the Production environment's required reviewer to approve the run
#
# verify_jwt is passed explicitly per function (there is no supabase/config.toml
# entry to read it from). It mirrors live state; rc-webhook and tip-chat carry
# their own auth and MUST stay --no-verify-jwt.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (or "all")'
        default: 'all'
        type: choice
        options: [all, first-referral-bonus, tip-screen, tip-chat, rc-webhook]

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  # Wallet PROD only. Staging (nszlbcmcysftwyudthjz) is deployed by hand;
  # yrqzwqywxfesmbvhzjgj is veyrnox.ai and must never receive wallet functions.
  SUPABASE_PROJECT_REF: jwstkrtslotnjyerzzsi

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: first-referral-bonus
            verify_jwt: 'true'
          - name: tip-screen
            verify_jwt: 'false'
          - name: tip-chat
            verify_jwt: 'false'
          - name: rc-webhook
            verify_jwt: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this function is in scope
        id: scope
        env:
          FN: ${{ matrix.name }}
          REQUESTED: ${{ github.event.inputs.function || 'all' }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "$FN" ]; then
            echo "in_scope=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            if git diff --quiet "$BEFORE" HEAD -- "supabase/functions/$FN" ".github/workflows/deploy-edge-functions.yml"; then
              echo "in_scope=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "in_scope=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.in_scope == 'true'
        with:
          node-version: 20
      - name: Deploy ${{ matrix.name }}
        if: steps.scope.outputs.in_scope == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FN: ${{ matrix.name }}
          VERIFY_JWT: ${{ matrix.verify_jwt }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on the Production environment"; exit 1
          fi
          FLAG=""
          if [ "$VERIFY_JWT" = "false" ]; then FLAG="--no-verify-jwt"; fi
          # Pinned CLI version; bump deliberately.
          npx --yes supabase@2.117.0 functions deploy "$FN" \
            --project-ref "$SUPABASE_PROJECT_REF" $FLAG
          echo "deployed $FN from $GITHUB_SHA (verify_jwt=$VERIFY_JWT)" >> "$GITHUB_STEP_SUMMARY"
