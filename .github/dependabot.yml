# Dependabot version updates. Surfaces outdated deps as grouped weekly PRs.
# Security advisories (when Dependabot alerts are enabled) open their own PRs.
# Reachability triage of existing advisories remains manual — see docs/SAST_FINDINGS.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # H-4: signing-path crypto packages are pinned to exact versions in package.json.
    # Dependabot must not silently open PRs bumping these — a supply-chain compromise
    # of any of them would sit directly under EVM/BTC/SOL signing. Version changes
    # require named crypto reviewer approval via CODEOWNERS on /package.json.
    ignore:
      - dependency-name: "ethers"
      - dependency-name: "@noble/curves"
      - dependency-name: "@noble/hashes"
      - dependency-name: "@scure/bip32"
      - dependency-name: "@scure/bip39"
      - dependency-name: "@scure/btc-signer"
      - dependency-name: "@reown/walletkit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
