<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-labelledby="title desc">
  <title id="title">Veyrnox Low Level Mobile Security Architecture</title>
  <desc id="desc">Low level implementation-backed security architecture diagram for Veyrnox mobile showing concrete modules, trust boundaries, data flows, cryptographic functions, signing path, WalletConnect controls, and AI Security Advisor controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3efe7"/>
      <stop offset="100%" stop-color="#e8e1d4"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102f29"/>
      <stop offset="100%" stop-color="#254940"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f1916" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f1916" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#55656f"/>
    </marker>
    <marker id="arrowRisk" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#8b4f47"/>
    </marker>
    <style>
      .h1 { font: 700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #fff; }
      .h2 { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #18252c; }
      .h3 { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #17242b; }
      .body { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #27343c; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #394850; }
      .mono { font: 600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #22313a; }
      .label { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #4b5962; letter-spacing: 1.3px; text-transform: uppercase; }
      .legend { font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #24313a; }
    </style>
  </defs>

  <rect width="2200" height="1480" fill="url(#bg)"/>
  <rect x="38" y="28" width="2124" height="92" rx="24" fill="url(#head)" filter="url(#shadow)"/>
  <text x="72" y="82" class="h1">Veyrnox Low-Level Mobile Security Architecture</text>
  <text x="72" y="108" class="small" fill="#d9e5df">Implementation-backed module, trust-boundary, and data-flow view based on current mobile code paths</text>

  <!-- User / OS -->
  <text x="56" y="166" class="label">Input Boundary</text>
  <g filter="url(#soft)">
    <rect x="54" y="188" width="310" height="100" rx="20" fill="#d8e7df" stroke="#3f6e5b" stroke-width="2.5"/>
    <text x="82" y="228" class="h3">User PIN / Password</text>
    <text x="82" y="255" class="body">Primary credential entered into WalletEntry / unlock / changePassword flows</text>
  </g>
  <g filter="url(#soft)">
    <rect x="54" y="310" width="310" height="100" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="82" y="350" class="h3">OS Biometric / Device Unlock</text>
    <text x="82" y="377" class="body">Native ceremony surfaced by BiometricAuth and HardwareKek plugin paths</text>
  </g>

  <!-- Native boundary -->
  <g filter="url(#shadow)">
    <rect x="408" y="150" width="670" height="1120" rx="28" fill="#edf4f8" stroke="#728897" stroke-width="3"/>
  </g>
  <text x="440" y="196" class="h2">Native Security Boundary</text>
  <text x="440" y="224" class="body">Concrete modules selected only on Capacitor native platforms</text>

  <g filter="url(#soft)">
    <rect x="438" y="254" width="610" height="118" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="466" y="294" class="h3">src/wallet-core/keystore/index.js</text>
    <text x="466" y="322" class="mono">getKeyStore() -&gt; makeNativeFacade() -&gt; import('./native.js')</text>
    <text x="466" y="348" class="body">Platform switch: webKeyStore on web, native facade on iOS / Android</text>
  </g>

  <g filter="url(#soft)">
    <rect x="438" y="392" width="610" height="172" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="466" y="432" class="h3">src/wallet-core/keystore/native.js</text>
    <text x="466" y="460" class="mono">createVault() / unlock() / saveVaultContents() / changePassword()</text>
    <text x="466" y="486" class="mono">enrollKek() / unenrollKek() / exportPersonalBackupShares()</text>
    <text x="466" y="512" class="body">Persists ciphertext through native storage, preserves KEK wraps, suppresses lock during OS dialogs, clears stale DEK cache on KEK-changing paths</text>
    <text x="466" y="538" class="body">Returns plaintext secret only transiently to WalletProvider</text>
  </g>

  <g filter="url(#soft)">
    <rect x="438" y="586" width="610" height="160" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="466" y="626" class="h3">src/wallet-core/keystore/hardware.js</text>
    <text x="466" y="654" class="mono">enrollHardwareCredential() / getHardwareFactor() / clearHardwareCredential()</text>
    <text x="466" y="680" class="body">JS bridge to native HardwareKek plugin</text>
    <text x="466" y="706" class="body">Normalizes tier, base64-encodes kekSalt for bridge safety, maps native failures to stable error codes</text>
  </g>

  <g filter="url(#soft)">
    <rect x="438" y="768" width="610" height="146" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="466" y="808" class="h3">Native Backing Services</text>
    <text x="466" y="836" class="body">SecureStorage: durable vault persistence</text>
    <text x="466" y="862" class="body">BiometricAuth: app-layer biometric ceremony where applicable</text>
    <text x="466" y="888" class="body">HardwareKek plugin: hardware factor retrieval and enrollment</text>
  </g>

  <g filter="url(#soft)">
    <rect x="438" y="936" width="610" height="146" rx="20" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2.5"/>
    <text x="466" y="976" class="h3">RASP / Attestation Sources</text>
    <text x="466" y="1004" class="mono">src/rasp/nativeProbe.js / src/rasp/attestation.js</text>
    <text x="466" y="1030" class="body">Native environment signals sampled fresh at sign time via getFreshRaspArtifact()</text>
  </g>

  <!-- Crypto core -->
  <g filter="url(#shadow)">
    <rect x="1120" y="150" width="540" height="1120" rx="28" fill="#fbf3e4" stroke="#a87a33" stroke-width="3"/>
  </g>
  <text x="1154" y="196" class="h2">Cryptographic Core</text>
  <text x="1154" y="224" class="body">Actual functions and protected data transitions</text>

  <g filter="url(#soft)">
    <rect x="1150" y="256" width="480" height="176" rx="20" fill="#f4e2c7" stroke="#8f6d33" stroke-width="2.5"/>
    <text x="1178" y="296" class="h3">src/wallet-core/vault.js</text>
    <text x="1178" y="324" class="mono">encryptVault() / decryptVault()</text>
    <text x="1178" y="350" class="mono">encryptVaultWithDek() / decryptVaultWithDek() / vaultAad()</text>
    <text x="1178" y="376" class="body">Argon2id + AES-256-GCM, 192 MiB KDF policy, authenticated metadata, strict malformed-vault rejection</text>
    <text x="1178" y="402" class="body">Base format for bare and KEK-enrolled vaults</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1150" y="454" width="480" height="176" rx="20" fill="#f4e2c7" stroke="#8f6d33" stroke-width="2.5"/>
    <text x="1178" y="494" class="h3">src/wallet-core/keystore/kek.js</text>
    <text x="1178" y="522" class="mono">combineKek(H, C) =&gt; HKDF(H || C)</text>
    <text x="1178" y="548" class="mono">wrapDek() / unwrapDek() / decodeKekSalt() / parseVaultBlob()</text>
    <text x="1178" y="574" class="body">Rejects missing H/C, malformed vault, degenerate input, wrong-length factors, unwrap failure</text>
    <text x="1178" y="600" class="body">This is the real KEK/DEK trust hinge</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1150" y="652" width="480" height="140" rx="20" fill="#f4e2c7" stroke="#8f6d33" stroke-width="2.5"/>
    <text x="1178" y="692" class="h3">Protected Data Forms</text>
    <text x="1178" y="720" class="body">Bare vault: Argon2id-derived key directly protects vault ciphertext</text>
    <text x="1178" y="746" class="body">KEK vault: H + C -&gt; KEK -&gt; wrapped DEK -&gt; vault ciphertext</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1150" y="814" width="480" height="186" rx="20" fill="#f4e2c7" stroke="#8f6d33" stroke-width="2.5"/>
    <text x="1178" y="854" class="h3">Sensitive Material Lifetime</text>
    <text x="1178" y="882" class="body">H: hardware factor from native path</text>
    <text x="1178" y="908" class="body">C: Argon2id-derived factor</text>
    <text x="1178" y="934" class="body">KEK: HKDF output</text>
    <text x="1178" y="960" class="body">DEK: wraps or decrypts vault content</text>
    <text x="1178" y="986" class="body">All cleared best-effort in finally blocks across native.js and kek.js</text>
  </g>

  <!-- JS runtime boundary -->
  <g filter="url(#shadow)">
    <rect x="1700" y="150" width="458" height="1120" rx="28" fill="#f2eaf5" stroke="#7a5b8d" stroke-width="3"/>
  </g>
  <text x="1732" y="196" class="h2">WebView / JS Runtime</text>
  <text x="1732" y="224" class="body">Unlocked session, key derivation, sign-time policy, and current signer location</text>

  <g filter="url(#soft)">
    <rect x="1730" y="256" width="398" height="176" rx="20" fill="#eadff0" stroke="#7a5b8d" stroke-width="2.5"/>
    <text x="1758" y="296" class="h3">src/lib/WalletProvider.jsx</text>
    <text x="1758" y="324" class="mono">unlock orchestration + live session store</text>
    <text x="1758" y="350" class="mono">withPrivateKey() / withBtcPrivateKey() / withSolPrivateKey()</text>
    <text x="1758" y="376" class="body">Mnemonic held transiently in JS memory, keys derived on demand, lock increments signing generation to invalidate in-flight trust</text>
    <text x="1758" y="402" class="body">BTC/SOL byte arrays zeroed after callback; EVM key is still a JS string</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1730" y="454" width="398" height="170" rx="20" fill="#f0d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="1758" y="494" class="h3">src/pages/SendCrypto.jsx</text>
    <text x="1758" y="522" class="mono">sendTx mutationFn = final software chokepoint</text>
    <text x="1758" y="548" class="body">Revalidates recipient, amount, seed-verify gate, limits, risk, fresh RASP, TIP readiness, and biometric / 2FA conditions at sign time</text>
    <text x="1758" y="574" class="body">Button state is not the security boundary; mutationFn is</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1730" y="646" width="398" height="140" rx="20" fill="#eadff0" stroke="#7a5b8d" stroke-width="2.5"/>
    <text x="1758" y="686" class="h3">src/wallet-core/evm/send.js</text>
    <text x="1758" y="714" class="mono">new Wallet(privateKey, provider).sendTransaction(...)</text>
    <text x="1758" y="740" class="body">EVM signing still happens in JS via ethers.Wallet</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1730" y="808" width="398" height="162" rx="20" fill="#f0d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="1758" y="848" class="h3">src/lib/WalletConnectProvider.jsx</text>
    <text x="1758" y="876" class="mono">presignGateOrReject() + request-specific validation</text>
    <text x="1758" y="902" class="body">Fresh async probe sampling, session expiry, chain binding, address binding, gas caps, and fail-closed request rejection</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1730" y="992" width="398" height="118" rx="20" fill="#eadff0" stroke="#7a5b8d" stroke-width="2.5"/>
    <text x="1758" y="1032" class="h3">src/rasp/getFreshRaspArtifact.js</text>
    <text x="1758" y="1060" class="body">Fresh-at-sign native probe + attestation sampling with fail-closed timeout</text>
  </g>

  <!-- Advisor boundary -->
  <g filter="url(#shadow)">
    <rect x="54" y="452" width="310" height="610" rx="28" fill="#fbefe2" stroke="#aa6d35" stroke-width="3" stroke-dasharray="10 8"/>
  </g>
  <text x="84" y="498" class="h2">AI Security Advisor Boundary</text>
  <text x="84" y="526" class="body">Advisory-only, outside custody and signing trust core</text>

  <g filter="url(#soft)">
    <rect x="84" y="554" width="250" height="114" rx="20" fill="#f6e7d8" stroke="#aa6d35" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="112" y="594" class="h3">src/lib/advisorBridge.js</text>
    <text x="112" y="622" class="body">Publishes live non-secret context and opens global advisor drawer</text>
  </g>

  <g filter="url(#soft)">
    <rect x="84" y="690" width="250" height="114" rx="20" fill="#f6e7d8" stroke="#aa6d35" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="112" y="730" class="h3">src/components/SecurityAdvisor.jsx</text>
    <text x="112" y="758" class="body">Vigil chat-style advisor with local fallback and optional remote answers</text>
  </g>

  <g filter="url(#soft)">
    <rect x="84" y="826" width="250" height="114" rx="20" fill="#f6e7d8" stroke="#aa6d35" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="112" y="866" class="h3">src/components/SecurityAdvisorBanner.jsx</text>
    <text x="112" y="894" class="body">Local threat-intel warning shown inline in the send flow</text>
  </g>

  <g filter="url(#soft)">
    <rect x="84" y="962" width="250" height="78" rx="18" fill="#f6e7d8" stroke="#aa6d35" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="112" y="1008" class="body">advisorConsent.js + advisorScrubber.js + advisorKnowledge.js</text>
  </g>

  <!-- External surfaces -->
  <g filter="url(#soft)">
    <rect x="1730" y="1142" width="182" height="92" rx="20" fill="#d8ddd6" stroke="#616c5a" stroke-width="2.5"/>
    <text x="1758" y="1180" class="h3">RPC Providers</text>
    <text x="1758" y="1208" class="body">Read / broadcast</text>
  </g>
  <g filter="url(#soft)">
    <rect x="1930" y="1142" width="198" height="92" rx="20" fill="#d8ddd6" stroke="#616c5a" stroke-width="2.5"/>
    <text x="1958" y="1180" class="h3">WalletConnect Peers</text>
    <text x="1958" y="1208" class="body">Untrusted request origin</text>
  </g>
  <g filter="url(#soft)">
    <rect x="84" y="1086" width="250" height="92" rx="20" fill="#d8ddd6" stroke="#616c5a" stroke-width="2.5"/>
    <text x="112" y="1124" class="h3">TIP-backed Online Advisor</text>
    <text x="112" y="1152" class="body">Optional remote answer path</text>
  </g>

  <!-- Key truth callout -->
  <g filter="url(#shadow)">
    <rect x="408" y="1300" width="1750" height="126" rx="22" fill="#fff8ef" stroke="#8f7654" stroke-width="2.5"/>
    <text x="442" y="1342" class="h3">Low-Level Architectural Conclusion</text>
    <text x="442" y="1370" class="body">Vault confidentiality and unlock are materially strengthened by native storage and hardware-factor gating, but the unlocked mnemonic and current signing path still enter the JS/WebView runtime through WalletProvider and the send modules.</text>
    <text x="442" y="1398" class="body">The AI Security Advisor is intentionally separated because it is advisory-only, consent-gated for remote answers, scrubbed, and outside the custody/signing trust root.</text>
  </g>

  <!-- Flow lines -->
  <path d="M364 238 C 410 238, 410 520, 438 520" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M364 360 C 410 360, 410 666, 438 666" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1048 666 C 1105 666, 1098 542, 1150 542" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M364 238 C 720 238, 760 344, 1150 344" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1630 344 C 1680 344, 1680 344, 1730 344" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1400 344 L1400 454" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1400 630 L1400 652" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1400 792 L1400 814" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M2128 344 C 2160 344, 2160 540, 2128 540" fill="none" stroke="#55656f" stroke-width="3" opacity="0"/>
  <path d="M1928 344 L1928 454" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1928 624 L1928 646" fill="none" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRisk)"/>
  <path d="M1928 786 L1928 808" fill="none" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRisk)"/>
  <path d="M1928 970 L1928 992" fill="none" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRisk)"/>
  <path d="M1928 624 C 1860 624, 1850 1188, 1912 1188" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1928 970 C 2000 970, 2028 1112, 2028 1142" fill="none" stroke="#55656f" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1730 540 C 1450 540, 620 970, 334 970" fill="none" stroke="#aa6d35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M1730 540 C 1460 540, 620 747, 334 747" fill="none" stroke="#aa6d35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M1730 540 C 1460 540, 620 883, 334 883" fill="none" stroke="#aa6d35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M334 1001 C 360 1001, 360 1132, 84 1132" fill="none" stroke="#aa6d35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g filter="url(#soft)">
    <rect x="54" y="1210" width="310" height="216" rx="22" fill="#fffaf3" stroke="#cfbea4" stroke-width="2"/>
  </g>
  <text x="84" y="1252" class="h3">Legend</text>
  <rect x="84" y="1272" width="24" height="24" rx="6" fill="#d8e7df" stroke="#3f6e5b" stroke-width="2"/>
  <text x="122" y="1290" class="legend">User / credential input</text>
  <rect x="84" y="1308" width="24" height="24" rx="6" fill="#dce8f2" stroke="#4a6a7d" stroke-width="2"/>
  <text x="122" y="1326" class="legend">Native module / platform-backed control</text>
  <rect x="84" y="1344" width="24" height="24" rx="6" fill="#f4e2c7" stroke="#8f6d33" stroke-width="2"/>
  <text x="122" y="1362" class="legend">Cryptographic layer / protected data transform</text>
  <rect x="84" y="1380" width="24" height="24" rx="6" fill="#eadff0" stroke="#7a5b8d" stroke-width="2"/>
  <text x="122" y="1398" class="legend">Live JS / WebView runtime</text>

  <g filter="url(#soft)">
    <rect x="382" y="1210" width="470" height="216" rx="22" fill="#fffaf3" stroke="#cfbea4" stroke-width="2"/>
  </g>
  <rect x="412" y="1272" width="24" height="24" rx="6" fill="#f0d9d6" stroke="#8b4f47" stroke-width="2"/>
  <text x="450" y="1290" class="legend">Sign-time enforcement / fail-closed gate</text>
  <rect x="412" y="1308" width="24" height="24" rx="6" fill="#d8ddd6" stroke="#616c5a" stroke-width="2"/>
  <text x="450" y="1326" class="legend">External or untrusted surface</text>
  <rect x="412" y="1344" width="24" height="24" rx="6" fill="#f6e7d8" stroke="#aa6d35" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="450" y="1362" class="legend">Advisory-only AI security surface</text>
  <line x1="412" y1="1390" x2="448" y2="1390" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRisk)"/>
  <text x="464" y="1396" class="legend">Security-critical gating / policy decision flow</text>
</svg>
