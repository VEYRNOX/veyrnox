<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Veyrnox Security Architecture - Page 2</title>
  <desc id="desc">Low-level data flow and threat/control security architecture diagram for Veyrnox mobile.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#ebe3d6"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#132f2a"/>
      <stop offset="100%" stop-color="#264640"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#13211d" flood-opacity="0.14"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#13211d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow2" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#586771"/>
    </marker>
    <marker id="arrowRed2" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#8b4f47"/>
    </marker>
    <style>
      .h1 { font: 700 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #fff; }
      .h2 { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #18242b; }
      .h3 { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #18242b; }
      .body { font: 500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #2c3941; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #516069; }
      .mono { font: 600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #24323a; }
      .label { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #55636b; letter-spacing: 1.3px; text-transform: uppercase; }
      .legend { font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #24323a; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg2)"/>
  <rect x="36" y="28" width="1848" height="88" rx="24" fill="url(#band2)" filter="url(#shadow2)"/>
  <text x="70" y="80" class="h1">Veyrnox Security Architecture</text>
  <text x="70" y="106" class="small" fill="#dbe8e1">Page 2 of 2  •  Low-level data flow + threat and control map</text>

  <!-- top half data flow -->
  <text x="50" y="160" class="label">Low-Level Data Flow</text>

  <g filter="url(#soft2)">
    <rect x="50" y="186" width="330" height="182" rx="24" fill="#d9e8df" stroke="#3f6e59" stroke-width="2.5"/>
    <text x="76" y="226" class="h3">1. User Credential Entry</text>
    <text x="76" y="254" class="body">WalletEntry / unlock / changePassword receives PIN or password.</text>
    <text x="76" y="282" class="body">This produces factor C through Argon2id in vault.js or deriveKekC.</text>
    <text x="76" y="316" class="mono">Sensitive data: password -&gt; C</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="430" y="186" width="330" height="182" rx="24" fill="#dce8f2" stroke="#4b6b7c" stroke-width="2.5"/>
    <text x="456" y="226" class="h3">2. Native Hardware Factor</text>
    <text x="456" y="254" class="body">hardware.js calls HardwareKek plugin through native.js.</text>
    <text x="456" y="282" class="body">OS biometric ceremony returns hardware factor H or stable fail code.</text>
    <text x="456" y="316" class="mono">Sensitive data: H</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="810" y="186" width="330" height="182" rx="24" fill="#f7e3c9" stroke="#9b7432" stroke-width="2.5"/>
    <text x="836" y="226" class="h3">3. KEK / DEK Recovery</text>
    <text x="836" y="254" class="body">kek.js combines H and C into KEK, then unwraps DEK if vault is KEK-enrolled.</text>
    <text x="836" y="282" class="body">Bare vaults skip KEK and derive directly from password path.</text>
    <text x="836" y="316" class="mono">Sensitive data: KEK, DEK</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="1190" y="186" width="330" height="182" rx="24" fill="#f7e3c9" stroke="#9b7432" stroke-width="2.5"/>
    <text x="1216" y="226" class="h3">4. Vault Decryption</text>
    <text x="1216" y="254" class="body">vault.js decrypts ciphertext and validates AAD-bound metadata.</text>
    <text x="1216" y="282" class="body">Malformed vaults, wrong KEK, or wrong password all fail closed.</text>
    <text x="1216" y="316" class="mono">Sensitive data: mnemonic / container payload</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="1570" y="186" width="300" height="182" rx="24" fill="#ece1f1" stroke="#78598a" stroke-width="2.5"/>
    <text x="1596" y="226" class="h3">5. WalletProvider Session</text>
    <text x="1596" y="254" class="body">Mnemonic enters JS memory and lives transiently while unlocked.</text>
    <text x="1596" y="282" class="body">This is the main post-unlock trust boundary.</text>
    <text x="1596" y="316" class="mono">Sensitive data: mnemonic in JS</text>
  </g>

  <path d="M380 278 L430 278" fill="none" stroke="#586771" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M760 278 L810 278" fill="none" stroke="#586771" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M1140 278 L1190 278" fill="none" stroke="#586771" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M1520 278 L1570 278" fill="none" stroke="#586771" stroke-width="4" marker-end="url(#arrow2)"/>

  <!-- second row send/wc/advisor -->
  <g filter="url(#soft2)">
    <rect x="230" y="456" width="360" height="182" rx="24" fill="#ece1f1" stroke="#78598a" stroke-width="2.5"/>
    <text x="256" y="496" class="h3">6. Key Derivation on Demand</text>
    <text x="256" y="524" class="body">WalletProvider derives EVM, BTC, and SOL keys only when requested.</text>
    <text x="256" y="552" class="body">BTC / SOL byte arrays are cleared after use; EVM signer still uses JS string key material.</text>
    <text x="256" y="586" class="mono">Sensitive data: privateKey</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="640" y="456" width="360" height="182" rx="24" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="666" y="496" class="h3">7. SendCrypto Chokepoint</text>
    <text x="666" y="524" class="body">sendTx mutationFn re-checks recipient, amount, risk, limits, seed-verify, fresh RASP, TIP readiness, and 2FA.</text>
    <text x="666" y="558" class="mono">Security boundary: sign-time mutationFn</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="1050" y="456" width="360" height="182" rx="24" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="1076" y="496" class="h3">8. WalletConnect Chokepoint</text>
    <text x="1076" y="524" class="body">WalletConnectProvider applies fresh probes, session expiry, chain binding, address binding, and gas caps before key use.</text>
    <text x="1076" y="558" class="mono">Security boundary: presignGateOrReject()</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="1460" y="456" width="410" height="182" rx="24" fill="#f6e8d9" stroke="#aa6d35" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="1486" y="496" class="h3">9. AI Security Advisor</text>
    <text x="1486" y="524" class="body">advisorBridge publishes non-secret context. SecurityAdvisor uses local knowledge or optional consented remote TIP-backed answers.</text>
    <text x="1486" y="558" class="body">advisorScrubber removes secret-like material before remote send.</text>
    <text x="1486" y="592" class="mono">Security posture: advisory-only, not signing authority</text>
  </g>

  <path d="M1740 368 C 1740 410, 410 410, 410 456" fill="none" stroke="#586771" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M590 547 L640 547" fill="none" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRed2)"/>
  <path d="M590 547 C 820 547, 840 547, 1050 547" fill="none" stroke="#8b4f47" stroke-width="4" marker-end="url(#arrowRed2)"/>
  <path d="M1000 547 C 1220 547, 1260 547, 1460 547" fill="none" stroke="#aa6d35" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow2)"/>

  <!-- threat/control split -->
  <text x="50" y="722" class="label">Threats and Control Points</text>

  <!-- threats -->
  <g filter="url(#soft2)">
    <rect x="50" y="748" width="560" height="392" rx="28" fill="#fff8f6" stroke="#d5b4ae" stroke-width="2"/>
  </g>
  <text x="80" y="792" class="h2">Primary Threat Paths</text>
  <g filter="url(#soft2)">
    <rect x="80" y="824" width="500" height="78" rx="18" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="104" y="852" class="h3">T1. Device Theft / Offline Vault Extraction</text>
    <text x="104" y="880" class="body">Attacker steals ciphertext and attempts offline cracking or vault-format abuse.</text>
  </g>
  <g filter="url(#soft2)">
    <rect x="80" y="918" width="500" height="78" rx="18" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="104" y="946" class="h3">T2. Hooked / Rooted / Emulated Runtime</text>
    <text x="104" y="974" class="body">Attacker tampers with environment before signing or while wallet is unlocked.</text>
  </g>
  <g filter="url(#soft2)">
    <rect x="80" y="1012" width="500" height="78" rx="18" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="104" y="1040" class="h3">T3. WebView / JS Memory Exposure</text>
    <text x="104" y="1068" class="body">Unlocked mnemonic or EVM signing key exists inside JS runtime during active use.</text>
  </g>

  <!-- controls -->
  <g filter="url(#soft2)">
    <rect x="660" y="748" width="1210" height="392" rx="28" fill="#f8fbf8" stroke="#c9d9cf" stroke-width="2"/>
  </g>
  <text x="690" y="792" class="h2">Controls Mapped to Those Threats</text>

  <g filter="url(#soft2)">
    <rect x="690" y="824" width="550" height="120" rx="20" fill="#d9e8df" stroke="#3f6e59" stroke-width="2.5"/>
    <text x="716" y="862" class="h3">C1. Strong Vault Encryption</text>
    <text x="716" y="888" class="body">Argon2id + AES-256-GCM in vault.js with strict malformed-vault rejection and authenticated metadata.</text>
    <text x="716" y="916" class="small">Addresses T1 first.</text>
  </g>
  <g filter="url(#soft2)">
    <rect x="1260" y="824" width="580" height="120" rx="20" fill="#dce8f2" stroke="#4b6b7c" stroke-width="2.5"/>
    <text x="1286" y="862" class="h3">C2. Native Hardware-Gated KEK Path</text>
    <text x="1286" y="888" class="body">hardware.js + native.js + kek.js require both H and C for KEK-protected vaults and fail closed on invalidation or malformed state.</text>
    <text x="1286" y="916" class="small">Addresses T1 and part of T2.</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="690" y="964" width="550" height="120" rx="20" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="716" y="1002" class="h3">C3. Fresh-at-Sign Environment Gating</text>
    <text x="716" y="1028" class="body">getFreshRaspArtifact() re-samples native probe and attestation state at the real signing chokepoint.</text>
    <text x="716" y="1056" class="small">Addresses T2 first.</text>
  </g>
  <g filter="url(#soft2)">
    <rect x="1260" y="964" width="580" height="120" rx="20" fill="#f1d9d6" stroke="#8b4f47" stroke-width="2.5"/>
    <text x="1286" y="1002" class="h3">C4. Sign-Time Revalidation</text>
    <text x="1286" y="1028" class="body">SendCrypto and WalletConnect both re-check policy, not just UI state, before any key use or broadcast.</text>
    <text x="1286" y="1056" class="small">Addresses T2 and some request-layer abuse.</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="690" y="1104" width="1150" height="120" rx="20" fill="#f7e3c9" stroke="#9b7432" stroke-width="2.5"/>
    <text x="716" y="1142" class="h3">Residual Control Gap</text>
    <text x="716" y="1168" class="body">The current architecture still leaves T3 only partially mitigated, because WalletProvider and the EVM signing path remain in the JS runtime. The strongest future improvement is a native signer boundary that keeps sign/refuse enforcement and key use outside the WebView heap.</text>
  </g>

  <!-- connectors threat->control -->
  <path d="M580 863 C 630 863, 640 863, 690 863" fill="none" stroke="#586771" stroke-width="3.5" marker-end="url(#arrow2)"/>
  <path d="M580 863 C 980 863, 1080 863, 1260 863" fill="none" stroke="#586771" stroke-width="3.5" marker-end="url(#arrow2)"/>
  <path d="M580 957 C 630 957, 640 1024, 690 1024" fill="none" stroke="#586771" stroke-width="3.5" marker-end="url(#arrow2)"/>
  <path d="M580 957 C 980 957, 1100 1024, 1260 1024" fill="none" stroke="#586771" stroke-width="3.5" marker-end="url(#arrow2)"/>
  <path d="M580 1051 C 640 1051, 650 1164, 690 1164" fill="none" stroke="#8b4f47" stroke-width="3.5" marker-end="url(#arrowRed2)"/>

  <!-- footer callout -->
  <g filter="url(#soft2)">
    <rect x="50" y="1156" width="1820" height="24" rx="12" fill="#d2d8d2" opacity="0"/>
  </g>
</svg>
