apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Opt-in only: CI passes this property for Firebase Test Lab and the explicitly
// labelled staging store packages. Ordinary production builds leave it false.
def firebaseObservabilityEnabled =
    (project.findProperty('FIREBASE_OBSERVABILITY_ENABLED') ?: 'false').toBoolean()

android {
    namespace = "com.veyrnox.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    defaultConfig {
        applicationId "com.veyrnox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 39
        // Customer-facing version for the public Play launch. versionCode is internal
        // bookkeeping (monotonic, permanently consumed per upload, never shown to users);
        // versionName is what appears on the store listing.
        // 1.0.1 opens a new release train aligned with the iOS 1.0.1 train.
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // RASP APK tamper detection — inject via -PRELEASE_CERT_SHA256=<hash>.
        // Blank = fail-closed (I4). Release builds validate format at task start.
        buildConfigField "String", "RELEASE_CERT_SHA256", "\"${project.findProperty('RELEASE_CERT_SHA256') ?: ''}\""
        // Firebase observability is enabled only by an explicit CI build property.
        // Production stays disabled even if a config file is present accidentally.
        buildConfigField "boolean", "FIREBASE_OBSERVABILITY_ENABLED", "${firebaseObservabilityEnabled}"
        buildConfigField "boolean", "FIREBASE_OBSERVABILITY_SMOKE", "false"
        manifestPlaceholders.firebaseObservabilityCollectionEnabled = firebaseObservabilityEnabled
        // F-1 Gap 3 (2026-08-15). `firebase_performance_collection_enabled=false`
        // is a SOFT switch — setPerformanceCollectionEnabled(true) overrides it at
        // runtime. `..._deactivated=true` is the COMPILE-TIME kill switch and
        // cannot be overridden at runtime. Everything except the Test Lab variant
        // gets the hard form, so injected code in a shipped build cannot turn
        // Performance collection back on. Deliberately layered on top of "no
        // google-services.json ships" rather than replacing it.
        //
        // NOTE: Crashlytics has NO `_deactivated` equivalent —
        // setCrashlyticsCollectionEnabled(true) can always override the manifest
        // flag. For Crashlytics the absent config file remains the real control.
        manifestPlaceholders.firebasePerformanceDeactivated = !firebaseObservabilityEnabled
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Resolution order: keystore.properties (local dev / release box), then
            // env vars (CI). The property NAMES must match the file that is actually
            // in use — android/keystore.properties ships KEYSTORE_PATH /
            // KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD, so those are read first,
            // with the camelCase spellings accepted as a fallback.
            //
            // The two spellings carry DIFFERENT path conventions, so each needs its own
            // resolution base — resolving both against rootProject silently pointed
            // `storeFile=../veyrnox-upload.jks` at the repo root instead of android/:
            //   KEYSTORE_PATH (ours, and the env var CI sets) -> relative to android/
            //   storeFile     (Android Studio's generated spelling) -> relative to android/app/
            def propsFile = rootProject.file("keystore.properties")
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksBase = rootProject
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("KEY_ALIAS")
            def ksKeyPass = System.getenv("KEY_PASSWORD")

            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                if (props['KEYSTORE_PATH']) {
                    ksPath = props['KEYSTORE_PATH']
                } else if (props['storeFile']) {
                    ksPath = props['storeFile']
                    ksBase = project
                }
                ksPass    = props['KEYSTORE_PASSWORD'] ?: props['storePassword'] ?: ksPass
                ksAlias   = props['KEY_ALIAS']         ?: props['keyAlias']      ?: ksAlias
                ksKeyPass = props['KEY_PASSWORD']      ?: props['keyPassword']   ?: ksKeyPass
            }

            if (ksPath) {
                storeFile     ksBase.file(ksPath)
                storePassword ksPass
                keyAlias      ksAlias
                keyPassword   ksKeyPass
            }
        }
    }
    flavorDimensions "store"
    productFlavors {
        google {
            dimension "store"
            // Default — Play Store distribution. GMS + Play Integrity + Play Billing.
        }
        samsung {
            dimension "store"
            // Galaxy Store. Same GMS stack; Samsung IAP added via samsungImplementation.
        }
        huawei {
            dimension "store"
            applicationIdSuffix ".huawei"
            // AppGallery. HMS replaces GMS — Play Integrity and Firebase excluded.
        }
        fdroid {
            dimension "store"
            applicationIdSuffix ".fdroid"
            // F-Droid. No proprietary dependencies. No IAP. Local-only RASP.
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            def propsFile = rootProject.file("keystore.properties")
            def hasSigningConfig = propsFile.exists() || System.getenv("KEYSTORE_PATH")
            signingConfig hasSigningConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            // Remove unused resources (layouts, drawables, strings, etc.) from the
            // release APK. Reduces attack surface and APK size. Requires minifyEnabled
            // true (R8 drives the reachability analysis that shrinkResources depends on).
            shrinkResources true
            // Explicitly non-debuggable in release (defense-in-depth alongside the
            // MainActivity setWebContentsDebuggingEnabled(false) guard).
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Firebase Robo re-signs APKs by default. That is incompatible with the
        // pre-WebView RASP certificate gate, which intentionally blocks any APK
        // whose installed signer differs from the fingerprint embedded here.
        //
        // This is therefore a separate, APK-only test variant: it inherits every
        // release hardening setting, has a distinct package ID so it cannot replace
        // the production app, and embeds the same upload-key fingerprint that signs
        // the CI artifact. The Firebase workflow must pair it with --no-resign.
        firebaseTest {
            initWith release
            applicationIdSuffix ".firebase.testlab"
            versionNameSuffix "-firebase-test"
            matchingFallbacks = ['release']
            buildConfigField "String", "RELEASE_CERT_SHA256", "\"${project.findProperty('FIREBASE_TEST_CERT_SHA256') ?: ''}\""
            buildConfigField "boolean", "FIREBASE_OBSERVABILITY_ENABLED", "true"
            buildConfigField "boolean", "FIREBASE_OBSERVABILITY_SMOKE", "true"
            manifestPlaceholders.firebaseObservabilityCollectionEnabled = true
            // The ONLY variant that must not carry the hard kill switch — Test
            // Lab needs Performance traces (see F-1 Gap 3 note in defaultConfig).
            manifestPlaceholders.firebasePerformanceDeactivated = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Android's android.jar stubs org.json.* out for JVM unit tests (they throw
    // "not mocked" at runtime) — the real implementation must come from Maven for
    // PlayIntegrityNonceVerifierTest to parse test payloads. AndroidX/Android
    // Test framework doesn't pull org.json transitively for the JVM unit-test
    // classpath. Version pinned to a maintained release (Android SDK bundles
    // this same library at OS level; test-time we use the Maven artifact).
    testImplementation 'org.json:json:20240303'
    // BouncyCastle for JVM unit tests only — generates real P-256 key pairs and
    // self-signed X.509 certs in PlayIntegrityJwsVerifierTest without Robolectric.
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // --- GMS-only dependencies (google + samsung flavors) ---
    googleImplementation 'com.google.android.play:integrity:1.3.0'
    samsungImplementation 'com.google.android.play:integrity:1.3.0'

    googleImplementation platform('com.google.firebase:firebase-bom:34.16.0')
    googleImplementation 'com.google.firebase:firebase-crashlytics'
    googleImplementation 'com.google.firebase:firebase-perf'
    samsungImplementation platform('com.google.firebase:firebase-bom:34.16.0')
    samsungImplementation 'com.google.firebase:firebase-crashlytics'
    samsungImplementation 'com.google.firebase:firebase-perf'

    // --- Samsung Galaxy Store (RevenueCat handles billing) ---
    // The Galaxy module exposes the store backend but marks the core SDK as a
    // runtime dependency. The native Capacitor adapter imports these APIs, so
    // keep the matching compile dependencies scoped to Samsung only.
    samsungImplementation 'com.revenuecat.purchases:purchases:10.16.2'
    samsungImplementation 'com.revenuecat.purchases:purchases-hybrid-common:18.29.0'
    samsungImplementation 'com.revenuecat.purchases:purchases-store-galaxy:10.16.2'

    // --- Huawei HMS (AppGallery — no RevenueCat support, direct HMS IAP) ---
    huaweiImplementation 'com.huawei.hms:base:6.13.0.303'
    huaweiImplementation 'com.huawei.hms:iap:6.5.1.300'
    huaweiImplementation 'com.huawei.hms:safetydetect:6.3.0.301'
}

apply from: 'capacitor.build.gradle'

// Firebase Test Lab is google-flavor only. Disable bundle tasks for all flavors
// (APK-only) and disable non-google assembles entirely.
tasks.matching { it.name.contains('FirebaseTest') && it.name.startsWith('bundle') }.configureEach {
    enabled = false
}
tasks.matching {
    it.name.contains('FirebaseTest') && it.name.startsWith('assemble') &&
    !it.name.startsWith('assembleGoogle')
}.configureEach {
    enabled = false
}

tasks.matching { it.name == 'assembleGoogleFirebaseTest' }.configureEach {
    doFirst {
        def cert = project.findProperty('FIREBASE_TEST_CERT_SHA256') ?: ''
        if (!cert.matches(/^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$/)) {
            throw new GradleException(
                'FIREBASE_TEST_CERT_SHA256 must be 32 colon-separated hex pairs.\n' +
                'Derive it from the same upload keystore that signs this APK.')
        }

        def sc = android.signingConfigs.release
        if (sc.storeFile == null || !sc.storeFile.exists()) {
            throw new GradleException(
                'Firebase Test Lab signing is not configured. Expected the release ' +
                'upload keystore via KEYSTORE_PATH and its credential environment variables.')
        }

        def uploadSha
        try {
            def ks = java.security.KeyStore.getInstance('JKS')
            sc.storeFile.withInputStream {
                ks.load(it, sc.storePassword == null ? null : sc.storePassword.toCharArray())
            }
            def signingCert = ks.getCertificate(sc.keyAlias)
            if (signingCert == null) {
                throw new GradleException("No signing certificate found for alias '${sc.keyAlias}'.")
            }
            uploadSha = java.security.MessageDigest.getInstance('SHA-256')
                .digest(signingCert.encoded)
                .collect { String.format('%02X', it) }
                .join(':')
        } catch (GradleException e) {
            throw e
        } catch (Exception e) {
            throw new GradleException(
                "Could not derive the Firebase Test Lab signing fingerprint: ${e.message}", e)
        }

        if (!cert.equalsIgnoreCase(uploadSha)) {
            throw new GradleException(
                'FIREBASE_TEST_CERT_SHA256 does not match the keystore signing this APK.\n' +
                'Refusing to create a Firebase artifact that RASP will block at launch.')
        }
        logger.lifecycle('firebase-test signing guard: embedded fingerprint matches APK signer')
    }
}

tasks.matching { it.name.endsWith('Release') && (it.name.startsWith('bundle') || it.name.startsWith('assemble')) }.configureEach {
    doFirst {
        def cert = project.findProperty('RELEASE_CERT_SHA256') ?: ''
        if (cert.trim().isEmpty()) {
            throw new GradleException(
                'RELEASE_CERT_SHA256 is blank — the build would fail-closed (I4) on every device.\n' +
                'Pass -PRELEASE_CERT_SHA256="<Google app signing SHA-256>" on the command line.')
        }
        if (!cert.matches(/^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$/)) {
            throw new GradleException(
                "RELEASE_CERT_SHA256 has an invalid format: ${cert}\n" +
                'Expected 32 colon-separated hex pairs (e.g. AA:BB:CC:...).')
        }

        // A well-formed fingerprint can still be the WRONG one. The two mistakes that
        // actually happen are passing the debug keystore's fingerprint (copied from a
        // local debug invocation) or the upload cert's (it's the key you just used to
        // sign, so it looks right). Either ships an AAB whose RASP check compares
        // against a cert Play-installed builds were never signed with — tampered:true
        // on every launch, fail-closed but dead. Both fingerprints are derivable from
        // keystores already on disk, so this is machine-independent — no hardcoding.
        def sha256Of = { java.io.File ksFile, String storePass, String alias ->
            if (ksFile == null || !ksFile.exists() || alias == null) return null
            try {
                // "JKS" (not getDefaultType()) — the JDK's JKS provider runs in
                // compatibility mode and reads PKCS12 stores too; the reverse is not true.
                def ks = java.security.KeyStore.getInstance('JKS')
                ksFile.withInputStream { ks.load(it, storePass == null ? null : storePass.toCharArray()) }
                def c = ks.getCertificate(alias)
                if (c == null) return null
                return java.security.MessageDigest.getInstance('SHA-256')
                    .digest(c.encoded)
                    .collect { String.format('%02X', it) }
                    .join(':')
            } catch (Exception e) {
                // Unreadable keystore is not this guard's business — the signing-config
                // checks below fail on that. Skip rather than block the build, but SAY
                // so: a silent return here is what let the debug-cert check sit inert
                // for days (issue #1373).
                logger.warn("release-cert guard: could not read ${ksFile} (alias ${alias}): ${e.class.simpleName}: ${e.message}")
                return null
            }
        }
        def rel = android.signingConfigs.release
        def dbg = android.signingConfigs.debug
        def uploadSha = sha256Of(rel?.storeFile, rel?.storePassword, rel?.keyAlias)

        // FAIL CLOSED, symmetrically with the DEBUG branch below (#1386 closed that
        // one and left this one open). A release keystore that EXISTS but cannot be
        // read — wrong password, wrong alias, corrupt store — yields a null uploadSha,
        // and `uploadSha != null && ...` then skips the upload-cert comparison in
        // silence. The two checks further down only assert the storeFile is present
        // and exists; neither notices that it could not be OPENED.
        //
        // That is the same shape as #1373: the check reports nothing and the build
        // proceeds, so "could not verify" is indistinguishable from "verified fine".
        // Absent keystore is still legitimately null (nothing to compare against);
        // present-but-unreadable is not.
        if (uploadSha == null && rel?.storeFile != null && rel.storeFile.exists()) {
            def allowUnreadable =
                (project.findProperty('ALLOW_UNREADABLE_UPLOAD_KEYSTORE') ?: 'false').toString()
            if (allowUnreadable.equalsIgnoreCase('true')) {
                logger.warn('release-cert guard: UPLOAD-cert check SKIPPED by ' +
                    "-PALLOW_UNREADABLE_UPLOAD_KEYSTORE=true (${rel.storeFile} unreadable).")
            } else {
                throw new GradleException(
                    "RELEASE_CERT_SHA256 could not be checked against the UPLOAD cert.\n" +
                    "The release keystore exists at ${rel.storeFile} but could not be read " +
                    "with the configured credentials (alias '${rel?.keyAlias}').\n" +
                    'Check KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD. Skipping this check ' +
                    'silently is how the debug-cert branch sat inert for days (issue #1373), ' +
                    'so it now fails closed.\n' +
                    'Pass -PALLOW_UNREADABLE_UPLOAD_KEYSTORE=true to accept an unverified ' +
                    'fingerprint deliberately.')
            }
        }

        // Resolving the DEBUG keystore needs more than signingConfigs.debug.storeFile.
        //
        // Issue #1373: this check silently no-opped in CI for days while passing
        // locally. The CI step creates ~/.android/debug.keystore, derives its
        // fingerprint with keytool, feeds it in — and the guard did not reject it,
        // with no output explaining why. The three other cases (blank, malformed,
        // upload cert) all rejected correctly, so the guard itself was fine; only the
        // debug branch was dead, because `debugSha` came back null and the check is
        // `debugSha != null && ...` — a null turns it into a no-op. Fail OPEN, which
        // is backwards from I4 for a check whose whole job is to stop a mis-signed
        // release. That is the third regression of this guard (#1310 added -> #1313
        // dropped -> #1325 restored -> #1338 caught it -> inert since).
        //
        // The Gradle daemon's user.home need not be the shell's $HOME, so a keystore
        // the CI step just created can be invisible to signingConfigs.debug. Try every
        // location the file plausibly lives in, and if none of them work, say which
        // ones were tried instead of skipping in silence.
        def debugCreds = [
            (dbg?.storePassword ?: 'android'),
            (dbg?.keyAlias ?: 'AndroidDebugKey')
        ]
        def debugCandidates = new LinkedHashSet()
        if (dbg?.storeFile != null) debugCandidates << dbg.storeFile
        debugCandidates << new java.io.File(System.getProperty('user.home'), '.android/debug.keystore')
        def envHome = System.getenv('HOME')
        if (envHome) debugCandidates << new java.io.File(envHome, '.android/debug.keystore')
        def envUserProfile = System.getenv('USERPROFILE')
        if (envUserProfile) debugCandidates << new java.io.File(envUserProfile, '.android/debug.keystore')

        def debugSha = null
        def debugSource = null
        for (ks in debugCandidates) {
            // Aliases differ by who created the store: Android Studio writes
            // "AndroidDebugKey", `keytool -genkeypair` as used by CI writes
            // "androiddebugkey". JKS-compat lookup is case-insensitive, but try both
            // rather than depend on that.
            for (alias in [debugCreds[1], 'androiddebugkey', 'AndroidDebugKey'].unique()) {
                def sha = sha256Of(ks, debugCreds[0], alias)
                if (sha != null) { debugSha = sha; debugSource = "${ks} (alias ${alias})"; break }
            }
            if (debugSha != null) break
        }
        if (debugSha == null) {
            // FAIL CLOSED (I4). Previously this branch just skipped, so a release
            // could be built with an UNVERIFIED fingerprint and nothing said a word.
            // A check that cannot run is not a check that passed.
            //
            // The escape hatch is explicit and has to be typed on purpose, matching
            // the "remove this check deliberately rather than working around it"
            // wording the upload-cert branch already uses.
            def allowMissing = (project.findProperty('ALLOW_MISSING_DEBUG_KEYSTORE') ?: 'false').toString()
            def tried = debugCandidates.collect { "${it}${it.exists() ? '' : ' (missing)'}" }.join(', ')
            if (allowMissing.equalsIgnoreCase('true')) {
                logger.warn("release-cert guard: DEBUG-cert check SKIPPED by -PALLOW_MISSING_DEBUG_KEYSTORE=true. Tried: ${tried}")
            } else {
                throw new GradleException(
                    "RELEASE_CERT_SHA256 could not be checked against the DEBUG keystore cert.\n" +
                    "No readable debug keystore was found. Tried: ${tried}\n" +
                    'This check exists because passing the debug fingerprint ships an AAB whose ' +
                    'RASP check compares against a cert Play-installed builds never carried — ' +
                    'tampered:true on every launch. Skipping it silently is how it sat inert ' +
                    'for days (issue #1373), so it now fails closed.\n' +
                    'Create one with:\n' +
                    '  keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \\\n' +
                    '    -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \\\n' +
                    '    -validity 10000 -dname "CN=Android Debug,O=Android,C=US"\n' +
                    'or pass -PALLOW_MISSING_DEBUG_KEYSTORE=true to accept an unverified fingerprint.')
            }
        } else {
            logger.lifecycle("release-cert guard: debug cert resolved from ${debugSource}")
        }
        if (uploadSha != null && cert.equalsIgnoreCase(uploadSha)) {
            throw new GradleException(
                "RELEASE_CERT_SHA256 is the UPLOAD cert (${uploadSha}).\n" +
                'With Play App Signing enabled, Play re-signs the AAB with Google\'s app ' +
                'signing key, so the installed APK never carries the upload cert. Use the ' +
                'SHA-256 from Play Console -> Setup -> App integrity -> App signing key.\n' +
                'If this app is NOT enrolled in Play App Signing, the upload key IS the ' +
                'signing key — remove this check deliberately rather than working around it.')
        }
        if (debugSha != null && cert.equalsIgnoreCase(debugSha)) {
            throw new GradleException(
                "RELEASE_CERT_SHA256 is the DEBUG keystore cert (${debugSha}).\n" +
                'That value is for local debug builds only. Release builds need the ' +
                'SHA-256 from Play Console -> Setup -> App integrity -> App signing key.')
        }

        // Signing must actually have resolved. buildTypes.release selects
        // signingConfigs.release as soon as keystore.properties EXISTS — so a file
        // present but with unreadable keys would otherwise reach the packaging step
        // with no storeFile and fail obscurely (or, historically, silently debug-sign).
        def sc = android.signingConfigs.release
        if (sc.storeFile == null) {
            throw new GradleException(
                'Release signing is not configured.\n' +
                'Expected android/keystore.properties with KEYSTORE_PATH / ' +
                'KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD, or the equivalent ' +
                'environment variables.')
        }
        if (!sc.storeFile.exists()) {
            throw new GradleException(
                "Keystore not found at: ${sc.storeFile}\n" +
                'KEYSTORE_PATH is resolved relative to android/; the Android Studio ' +
                'spelling `storeFile` is resolved relative to android/app/.')
        }
    }
}

// Per-store plugin application.
// Google Services (google + samsung): needs google-services.json.
// AGConnect (huawei): needs agconnect-services.json.
// F-Droid: no proprietary plugins.
android.applicationVariants.configureEach { variant ->
    def flavorName = variant.productFlavors*.name.find()
    if (flavorName in ['google', 'samsung']) {
        try {
            def servicesJSON = file('google-services.json')
            if (servicesJSON.text) {
                if (!project.pluginManager.hasPlugin('com.google.gms.google-services')) {
                    apply plugin: 'com.google.gms.google-services'
                    apply plugin: 'com.google.firebase.crashlytics'
                    apply plugin: 'com.google.firebase.firebase-perf'
                }
            }
        } catch (Exception e) {
            logger.info("google-services.json not found for ${flavorName}, Firebase plugins not applied.")
        }
    } else if (flavorName == 'huawei') {
        try {
            def agcJSON = file('agconnect-services.json')
            if (agcJSON.text) {
                if (!project.pluginManager.hasPlugin('com.huawei.agconnect')) {
                    apply plugin: 'com.huawei.agconnect'
                }
            }
        } catch (Exception e) {
            logger.info("agconnect-services.json not found for huawei, AGConnect plugin not applied.")
        }
    }
}
